name: asr-words

# Same trigger trick as fetch.yml: this repo's default branch is not where the
# work happens, so a push to the request file is the trigger.
on:
  push:
    paths:
      - ".github/asr-request.json"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          set -euo pipefail
          jq -c '{include: .items}' .github/asr-request.json > /tmp/m.json
          echo "matrix=$(cat /tmp/m.json)" >> "$GITHUB_OUTPUT"

  words:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q faster-whisper

      - name: Decode with word timestamps
        run: |
          set -uo pipefail
          mkdir -p work
          python .github/asr_words.py small "${{ matrix.out }}" 2>&1 | tail -40 | tee "work/fw_log_${{ strategy.job-index }}.txt" || true
          ls -l work

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "asr-bot"
          git config user.email "asr-bot@users.noreply.github.com"
          git add -f work/ 2>/dev/null || true
          git commit -m "asr: word timestamps ${{ matrix.out }}" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" && break
            sleep 10
          done
