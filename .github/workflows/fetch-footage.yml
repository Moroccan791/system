# One-shot bridge: release assets are unreachable from the editing
# sandbox (egress firewall), git objects are not. GitHub's runner
# downloads the footage-demi-1 release parts and republishes them on
# the `footage` branch, where the clipper drop pipeline can fetch
# them. Triggered by pushing this file; delete it once it has run.
name: fetch-footage
on:
  push:
    paths: [".github/workflows/fetch-footage.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download release parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/parts
          gh release download footage-demi-1 --repo "$GITHUB_REPOSITORY" --dir /tmp/parts
          ls -lh /tmp/parts
      - name: Republish parts on the footage branch
        run: |
          cd /tmp/parts
          git init -b footage
          git config user.email "actions@github.com"
          git config user.name "footage-fetch"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git add -f part_*.mp4
          git commit -m "Demi Lovato source parts 0-7 (from release footage-demi-1)"
          git push -u origin footage
          echo "BRIDGE_DONE"
