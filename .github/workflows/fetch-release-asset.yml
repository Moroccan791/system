name: fetch-release-asset
# Release assets are served from release-assets.githubusercontent.com, which some
# sandboxes cannot reach. Actions run inside GitHub's network, so a runner can
# take the asset out of the release and commit it to a branch — and a branch is
# fetched over codeload, which is always reachable.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        required: true
      pattern:
        description: asset name glob
        required: true
      out:
        description: path to commit to
        required: true
      branch:
        description: branch to push to
        required: true
        default: footage-intake
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: download
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p "$(dirname "${{ inputs.out }}")"
          gh release download "${{ inputs.tag }}" --pattern "${{ inputs.pattern }}" \
            --dir "$(dirname "${{ inputs.out }}")" --clobber
          ls -lh "$(dirname "${{ inputs.out }}")"
      - name: rename + commit
        run: |
          d="$(dirname "${{ inputs.out }}")"
          f=$(ls "$d" | head -1)
          mv "$d/$f" "${{ inputs.out }}"
          git config user.name  "intake-bot"
          git config user.email "intake@users.noreply.github.com"
          git checkout -B "${{ inputs.branch }}"
          git add -f "${{ inputs.out }}"
          git commit -m "intake: ${{ inputs.out }}"
          git push -f origin "${{ inputs.branch }}"
