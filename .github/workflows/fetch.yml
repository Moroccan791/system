name: fetch-footage

# Push-triggered on purpose: workflow_dispatch is only available once a
# workflow exists on the default branch, and this repo's default branch is not
# where the work happens. Dropping this request file is the trigger.
on:
  push:
    paths:
      - ".github/footage-request.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Read request
        id: req
        run: |
          set -euo pipefail
          cat .github/footage-request.json
          for k in tag pattern out_dir; do
            v=$(jq -r ".$k" .github/footage-request.json)
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.req.outputs.out_dir }}"
          gh release download "${{ steps.req.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.req.outputs.pattern }}" \
            --dir "${{ steps.req.outputs.out_dir }}" --clobber
          echo "--- downloaded ---"
          ls -l "${{ steps.req.outputs.out_dir }}"
          du -sh "${{ steps.req.outputs.out_dir }}"

      - name: Commit parts
        run: |
          set -euo pipefail
          git config user.name "footage-bot"
          git config user.email "footage-bot@users.noreply.github.com"
          git add -f "${{ steps.req.outputs.out_dir }}"
          git commit -m "footage: ${{ steps.req.outputs.tag }} -> ${{ steps.req.outputs.out_dir }}" || echo "nothing to commit"
          git push origin HEAD:"${{ github.ref_name }}"
