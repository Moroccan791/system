name: footage-bridge
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/5a6e6ca9-system
      - name: Download release parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .footage
          gh release download footage-demi-1 --dir .footage
          ls -la .footage
      - name: Commit parts to branch
        run: |
          git config user.name "footage-bridge"
          git config user.email "bridge@local"
          git add -f .footage
          git commit -m "footage bridge: demi episode parts (temp)"
          git push origin arena/5a6e6ca9-system
