name: asr-timings

# Same trigger trick as fetch.yml: workflow_dispatch needs the workflow to exist
# on the default branch, which is not where the work happens. Dropping the
# request file is the trigger.
on:
  push:
    paths:
      - ".github/asr-request.json"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          set -euo pipefail
          jq -c '{include: .items}' .github/asr-request.json > /tmp/m.json
          cat /tmp/m.json
          echo "matrix=$(cat /tmp/m.json)" >> "$GITHUB_OUTPUT"

  asr:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q sherpa-onnx numpy

      - name: Model
        run: |
          set -euo pipefail
          mkdir -p asr-model
          curl -sL --retry 3 -o /tmp/m.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2"
          tar -xjf /tmp/m.tar.bz2 -C asr-model

      - name: Decode
        run: |
          set -uo pipefail
          mkdir -p work
          python .github/asr_run.py asr-model "${{ matrix.out }}" 2>&1 | tail -40 | tee "work/asr_log_${{ strategy.job-index }}.txt" || true
          ls -l work

      # Job logs are not reachable from the sandbox, so whatever happened is
      # committed — including the traceback when it goes wrong.
      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "asr-bot"
          git config user.email "asr-bot@users.noreply.github.com"
          git add -f work/ 2>/dev/null || true
          git commit -m "asr: ${{ matrix.out }}" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" && break
            sleep 10
          done
