name: probe

on:
  push:
    paths:
      - ".github/probe-request.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q faster-whisper
      - run: |
          set -uo pipefail
          mkdir -p work
          python .github/probe.py 2>&1 | tail -60 | tee work/probe_log.txt || true
      - if: always()
        run: |
          set -euo pipefail
          git config user.name "asr-bot"
          git config user.email "asr-bot@users.noreply.github.com"
          git add -f work/ 2>/dev/null || true
          git commit -m "probe: phrase-by-phrase" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" && break
            sleep 10
          done
