name: fetch-post3

# Why this exists: this sandbox can reach github.com and api.github.com but NOT
# release-assets.githubusercontent.com, so `gh release download` dies after the
# 302. GitHub's runners have no such restriction. This job pulls the assets
# there, joins the parts, transcodes to the size we deliver, and commits the
# result back to this branch — which the sandbox can read over git.
#
# It runs only when this file changes, so committing the result back does not
# retrigger it.

on:
  push:
    paths:
      - '.github/workflows/fetch-post3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: tools
        run: |
          set -euo pipefail
          # the 24.04 image does not ship ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p studio/raw/post3
          gh release download post3-ig-yt --repo "${{ github.repository }}" \
            --dir studio/raw/post3 --clobber
          ls -l studio/raw/post3
          du -sh studio/raw/post3

      - name: join the parts
        run: |
          set -euo pipefail
          cd studio/raw/post3
          ls clip_*.webm | sort
          # the parts are separate encodings, not one file cut in bytes, so the
          # concat demuxer is the join — a `cat` produces a file ffprobe cannot
          # read (proven: it did exactly that on the first run)
          rm -f list.txt joined.webm
          for f in $(ls clip_*.webm | sort); do echo "file '$PWD/$f'" >> list.txt; done
          cat list.txt
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy joined.webm
          echo "--- joined ---"
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -of default=nw=1 joined.webm | tee probe.txt

      - name: transcode to what we deliver
        run: |
          set -euo pipefail
          cd studio/raw/post3
          # 30 fps because that is the delivery rate: the source is 60 fps 4K and
          # nothing downstream can use the extra frames. crf 21 rather than 18
          # because the last attempt encoded to a file GitHub refuses to accept
          # (100 MB per-file limit) — and a scenepack is not an archive master.
          ffmpeg -y -v error -i joined.webm \
            -vf "scale=-2:1080,fps=30" -c:v libx264 -preset medium -crf 21 \
            -pix_fmt yuv420p -an pack_1080.mp4
          ls -l pack_1080.mp4
          BYTES=$(stat -c%s pack_1080.mp4)
          echo "pack_1080.mp4 = $BYTES bytes"
          if [ "$BYTES" -gt 95000000 ]; then
            echo "over the 100 MB push limit, splitting into parts"
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 pack_1080.mp4)
            HALF=$(python3 -c "print(f'{$DUR/2:.3f}')")
            ffmpeg -y -v error -i pack_1080.mp4 -t "$HALF" -c copy pack_1080_a.mp4
            ffmpeg -y -v error -ss "$HALF" -i pack_1080.mp4 -c copy pack_1080_b.mp4
            rm -f pack_1080.mp4
          fi
          # the track gets a plain name so no later command has a URL in it
          mv YTDown*Arcade*128k.mp3 arcade.mp3
          ls -l

      - name: diagnostics first, so a failed media push still explains itself
        run: |
          set -euo pipefail
          cd studio/raw/post3
          {
            echo "date: $(date -u)"
            echo "git: $(git --version)"
            echo "repo size limit check, largest files:"
            ls -lS | head -8
            echo "du: $(du -sh . | cut -f1)"
            echo "github free file limit is 100 MB per file, 2 GB per push"
          } > diag.txt
          cat diag.txt
          git config user.name  "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -f diag.txt probe.txt
          git commit -m "post3: diagnostics" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: commit the result back to this branch
        run: |
          set -euo pipefail
          git config user.name  "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          # the parts and the intermediate join live only on the runner
          rm -f studio/raw/post3/clip_*.webm studio/raw/post3/joined.webm \
                studio/raw/post3/list.txt
          # -f because .gitignore excludes *.mp4 and *.mp3
          git add -f studio/raw/post3
          du -sh studio/raw/post3
          git commit -m "post3: parts joined and transcoded to 1080p30" || echo "nothing to commit"
          # if the push is refused, keep the reason instead of losing it: reset
          # the media out of the commit and publish the error text alone
          if ! git push origin HEAD:${{ github.ref_name }} 2> push_err.txt; then
            echo "--- push refused ---"; cat push_err.txt
            git reset --soft HEAD~1
            git reset
            git add -f studio/raw/post3/push_err.txt
            git commit -m "post3: the push was refused, here is why" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi
