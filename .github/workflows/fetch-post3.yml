name: fetch-post3

# Why this exists: this sandbox can reach github.com and api.github.com but NOT
# release-assets.githubusercontent.com, so `gh release download` dies after the
# 302. GitHub's runners have no such restriction. This job pulls the assets
# there, joins the parts, transcodes to the size we deliver, and commits the
# result back to this branch — which the sandbox can read over git.
#
# It runs only when this file changes, so committing the result back does not
# retrigger it.

on:
  push:
    paths:
      - '.github/workflows/fetch-post3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: tools
        run: |
          set -euo pipefail
          # the 24.04 image does not ship ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p studio/raw/post3
          gh release download post3-ig-yt --repo "${{ github.repository }}" \
            --dir studio/raw/post3 --clobber
          ls -l studio/raw/post3
          du -sh studio/raw/post3

      - name: join the parts
        run: |
          set -euo pipefail
          cd studio/raw/post3
          ls clip_*.webm | sort
          # the parts are separate encodings, not one file cut in bytes, so the
          # concat demuxer is the join — a `cat` produces a file ffprobe cannot
          # read (proven: it did exactly that on the first run)
          rm -f list.txt joined.webm
          for f in $(ls clip_*.webm | sort); do echo "file '$PWD/$f'" >> list.txt; done
          cat list.txt
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy joined.webm
          echo "--- joined ---"
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -of default=nw=1 joined.webm | tee probe.txt

      - name: transcode to what we deliver
        run: |
          set -euo pipefail
          cd studio/raw/post3
          ffmpeg -y -v error -i joined.webm \
            -vf "scale=-2:1080" -c:v libx264 -preset medium -crf 18 \
            -pix_fmt yuv420p -an pack_1080.mp4
          ls -l pack_1080.mp4
          # the track gets a plain name so no later command has a URL in it
          mv YTDown*Arcade*128k.mp3 arcade.mp3
          ls -l

      - name: commit the result back to this branch
        run: |
          set -euo pipefail
          git config user.name  "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          # the parts and the intermediate join live only on the runner; the
          # branch keeps the delivery copy, the probe and the audio
          rm -f studio/raw/post3/clip_*.webm studio/raw/post3/joined.webm \
                studio/raw/post3/list.txt
          git add -A studio/raw/post3
          du -sh studio/raw/post3
          git commit -m "post3: four parts joined and transcoded to 1080p" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
