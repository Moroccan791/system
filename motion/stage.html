  } else if (V.name === "bridge") {
    const q = easeOut(clamp01((lt - 0.1) / 0.6));
    n.brArc.style.strokeDashoffset = (n.brLen * (1 - q)).toFixed(1);
    const tq = clamp01((lt - 0.55) / Math.max(0.3, dur - 0.85));
    const bx = (1 - tq) * (1 - tq) * 192 + 2 * (1 - tq) * tq * 300 + tq * tq * 408;
    const by = (1 - tq) * (1 - tq) * 18 + 2 * (1 - tq) * tq * -96 + tq * tq * 18;
    n.brDot.setAttribute("cx", (bx * s).toFixed(1));
    n.brDot.setAttribute("cy", ((n.brcy + by) * s).toFixed(1));
    n.brDot.setAttribute("opacity", clamp01((lt - 0.5) / 0.2).toFixed(2));
  } else if (V.name === "puzzle") {
    const q = easeOut(clamp01((lt - 0.08) / 0.5));
    const snap = lt > 0.58 && lt < 0.72 ? 1 + Math.sin((lt - 0.58) / 0.14 * Math.PI) * 0.03 : 1;
    n.pzR.setAttribute("transform", `translate(${(64 * (1 - q) * s).toFixed(1)} 0)`);
    n.pzTxL.setAttribute("transform", `translate(${(-64 * (1 - q) * s).toFixed(1)} 0)`);
    n.pzTxR.setAttribute("transform", `translate(${(64 * (1 - q) * s).toFixed(1)} 0)`);
    n.pzL.style.transformOrigin = `${310 * s}px ${n.pzcy * s}px`;
    n.pzL.style.transform = `translateX(${(-64 * (1 - q) * s).toFixed(1)}px) scale(${snap.toFixed(3)})`;
  } else if (V.name === "cycle") {
    n.cyG.setAttribute("transform", `rotate(${((lt * 42) % 360).toFixed(1)} ${300 * s} ${n.cycy * s})`);
  } else if (V.name === "thermo") {
    const q = easeInOut(clamp01(lt / Math.min(1.3, dur * 0.6)));
    const hMax = 196, h = Math.max(8, hMax * (n.thVal / 100) * q);
    n.thMerc.setAttribute("height", (h * s).toFixed(1));
    n.thMerc.setAttribute("y", ((n.thcy + 56 - h + 8) * s).toFixed(1));
    n.thTx.textContent = Math.round(n.thVal * q) + "%";
  } else if (V.name === "cowfield") {
    (n.cows || []).forEach((c, i) => {
      const q = easeOutBack(clamp01((lt - 0.05 - i * 0.03) / 0.3));
      c.g.setAttribute("opacity", clamp01(q * 1.6).toFixed(2));
      c.g.setAttribute("transform", `translate(0 ${((1 - clamp01(q)) * 14 * s).toFixed(1)})`);
    });
    if (n.hotCow) {
      // the odd one out turns on the point, mid-scene, and pulses
      const on = p > 0.45;
      n.hotCow.body.setAttribute("fill", on ? n.hotColor : "#F4F7EF");
      n.hotCow.head.setAttribute("fill", on ? n.hotColor : "#F4F7EF");
      const sc = on ? 1 + 0.08 * Math.sin((p - 0.45) * 22) * Math.max(0, 1 - (p - 0.45) * 2) + 0.08 : 1;
      n.hotCow.g.setAttribute("transform",
        `translate(${(n.hotCow.cx * (1 - sc) * s).toFixed(1)} ${(n.hotCow.cy * (1 - sc) * s).toFixed(1)}) scale(${sc.toFixed(3)})`);
    }
  } else if (V.name === "roadcar") {
    const q = easeInOut(clamp01(lt / Math.max(0.4, dur * 0.92)));
    const x = -90 + (690) * q;   // unit space: enters left, exits right
    n.car.setAttribute("transform", `translate(${(x * s).toFixed(1)} ${(n.roadY * s).toFixed(1)})`);
    n.dash.setAttribute("stroke-dashoffset", (-lt * 210 * s).toFixed(1));
    const wr = `rotate(${((lt * 560) % 360).toFixed(0)}`;
    n.wheel1.setAttribute("transform", `${wr} ${(-36 * s).toFixed(1)} ${(10 * s).toFixed(1)})`);
    n.wheel2.setAttribute("transform", `${wr} ${(38 * s).toFixed(1)} ${(10 * s).toFixed(1)})`);
  } else if (V.name === "dominoes") {
    n.doms.forEach((d, i) => {
      const q = easeInOut(clamp01((p - 0.10 - i * 0.085) / 0.20));
      d.g.setAttribute("transform", `rotate(${(q * 76).toFixed(1)} ${d.px} ${d.py})`);
    });
  } else if (V.name === "iceberg") {
    n.ice.setAttribute("transform", `translate(0 ${(Math.sin(lt * 1.25) * 9 * s).toFixed(1)})`);
    n.mass.setAttribute("opacity", (0.42 + 0.22 * Math.sin(lt * 2.4) * clamp01((p - 0.4) / 0.25)).toFixed(2));
  } else if (V.name === "bulb") {
    let lit;
    if (p < 0.30) lit = 0;
    else if (p < 0.48) lit = Math.sin(lt * 42) > -0.2 ? 1 : 0.08;
    else lit = 1;
    n.glass.setAttribute("fill", lit > 0.5 ? "#FFC93C" : "#232C3B");
    n.glow.setAttribute("opacity", (0.42 * lit).toFixed(2));
    n.rays.setAttribute("opacity", lit.toFixed(2));
  } else if (V.name === "flame") {
    const flick = (g, i) => {
      const sy = 1 + 0.05 * Math.sin(lt * 11 + i * 1.9) + 0.02 * Math.sin(lt * 23 + i);
      const rot = 1.6 * Math.sin(lt * 7 + i * 1.3);
      g.setAttribute("transform", `translate(${300 * s} ${n.flBase}) rotate(${rot.toFixed(2)}) scale(1 ${sy.toFixed(3)}) translate(${-300 * s} ${-n.flBase})`);
    };
    flick(n.flOuter, 0); flick(n.flMid, 1); flick(n.flInner, 2);
    n.sparks.forEach(sp => {
      const cyc = (lt * 120 + sp.ph) % 210;
      sp.el.setAttribute("cy", ((V.H / 2 + 84 - cyc) * s).toFixed(1));
      sp.el.setAttribute("cx", ((sp.x + Math.sin(lt * 3 + sp.ph) * 9) * s).toFixed(1));
      sp.el.setAttribute("opacity", (0.85 * Math.max(0, 1 - cyc / 210) * clamp01(lt / 0.4)).toFixed(2));
    });
  } else if (V.name === "sprout") {
    const q = easeOut(clamp01(lt / 0.85));
    const sh = 155 * q;
    n.stem.setAttribute("height", (sh * s).toFixed(1));
    n.stem.setAttribute("y", ((n.soilY - sh) * s).toFixed(1));
    const topY = (n.soilY - 150) * s;
    const kl = easeOutBack(clamp01((p - 0.42) / 0.22)), kr = easeOutBack(clamp01((p - 0.54) / 0.22));
    n.leafL.g.setAttribute("transform", `translate(${284 * s} ${topY}) rotate(-32) scale(${Math.max(0.001, kl).toFixed(3)})`);
    n.leafR.g.setAttribute("transform", `translate(${316 * s} ${topY}) rotate(32) scale(${Math.max(0.001, kr).toFixed(3)})`);
    n.roots.setAttribute("opacity", clamp01((p - 0.5) / 0.3).toFixed(2));
    n.sun.setAttribute("transform", `translate(0 ${(-26 * q * s).toFixed(1)})`);
  } else if (V.name === "oaktree") {
    n.oakDraws.forEach(d => {
      const q = easeOut(clamp01((lt - d.delay) / 0.33));
      d.el.setAttribute("stroke-dashoffset", (d.len * (1 - q)).toFixed(1));
    });
    n.canopies.forEach((c, i) => {
      const q = easeOutBack(clamp01((lt - c.delay) / 0.38));
      c.g.setAttribute("opacity", clamp01((lt - c.delay) / 0.12).toFixed(2));
      c.g.setAttribute("transform", `translate(${c.x * s} ${c.y * s}) scale(${(s * Math.max(0.01, q)).toFixed(3)})`);
    });
    const shade = easeOut(clamp01((lt - 0.82) / 0.38));
    n.shade.setAttribute("rx", (178 * shade * s).toFixed(1));
    n.shade.setAttribute("opacity", (0.22 * shade).toFixed(2));
    n.children.forEach((g, i) => {
      g.setAttribute("opacity", easeOut(clamp01((lt - 0.78 - i * 0.10) / 0.22)).toFixed(2));
    });
  } else if (V.name === "chess") {
    const seg = clamp01(p / 0.78) * (n.chessPath.length - 1);
    const i = Math.min(n.chessPath.length - 2, Math.floor(seg)), f = seg - i;
    const A = n.chessPath[i], B = n.chessPath[i + 1];
    const x = A[0] + (B[0] - A[0]) * f, y = A[1] + (B[1] - A[1]) * f - Math.sin(f * Math.PI) * 30;
    n.pawn.setAttribute("transform", `translate(${(x * s).toFixed(1)} ${(y * s).toFixed(1)})`);
    n.chessRing.setAttribute("opacity", clamp01((p - 0.8) / 0.15).toFixed(2));
  } else if (V.name === "anchor") {
    const q = easeIn(clamp01(lt / 0.85));
    const yTop = V.H * 0.14, yBot = n.anchorFloor - 84;
    const y = yTop + (yBot - yTop) * q;
    const sway = Math.sin(lt * 1.8) * 4 * (1 - q * 0.55);
    n.anchorG.setAttribute("transform", `translate(${300 * s} ${(y * s).toFixed(1)}) rotate(${sway.toFixed(2)})`);
    n.chain.setAttribute("y2", ((y - 128) * s).toFixed(1));
    n.chain.setAttribute("x2", ((300 + Math.sin(lt * 1.8) * 12 * (1 - q)) * s).toFixed(1));
    const splash = clamp01((p - 0.52) / 0.2) * (1 - clamp01((p - 0.78) / 0.2));
    [n.ring1, n.ring2].forEach((r, i) => {
      r.setAttribute("opacity", (0.75 * splash).toFixed(2));
      r.setAttribute("r", ((12 + splash * 34 + i * 10) * s).toFixed(1));
    });
  } else if (V.name === "balloon") {
    const rise = easeOut(clamp01(p / 0.85)) * 300;
    const sway = Math.sin(lt * 1.1) * 14;
    n.bal.setAttribute("transform", `translate(${(300 + sway) * s} ${(V.H / 2 + 150 - rise) * s}) rotate(${(Math.sin(lt * 0.9) * 2.2).toFixed(2)})`);
    n.burner.setAttribute("opacity", (0.45 + 0.4 * Math.abs(Math.sin(lt * 9))).toFixed(2));
    n.clouds.forEach((c, i) => c.setAttribute("transform", `translate(${(-lt * (8 + i * 5) * s).toFixed(1)} 0)`));
  } else if (V.name === "redflag") {
    const grow = easeOutBack(clamp01(lt / 0.45));
    const fx = n.flagX, ft = n.flagTop, fw = n.flagW * Math.max(0.05, grow), fh = n.flagH;
    let d = `M ${fx * s} ${ft * s}`;
    const steps = 7;
    for (let i = 1; i <= steps; i++) {
      d += ` L ${(fx + (fw / steps) * i) * s} ${(ft + Math.sin(lt * 6 + i * 0.95) * 8 * (i / steps)) * s}`;
    }
    for (let i = steps; i >= 0; i--) {
      d += ` L ${(fx + (fw / steps) * i) * s} ${(ft + fh + Math.sin(lt * 6 + i * 0.95 + 0.7) * 8 * (i / steps)) * s}`;
    }
    n.flag.setAttribute("d", d + " Z");
  } else if (V.name === "ghost") {
    const cy = V.H / 2;
    const drift = easeInOut(clamp01((p - 0.45) / 0.5)) * 120;
    n.ghost.setAttribute("transform", `translate(${(300 + drift + Math.sin(lt * 1.4) * 10) * s} ${(cy + Math.sin(lt * 2.1) * 13) * s}) rotate(${(Math.sin(lt * 1.3) * 3).toFixed(2)})`);
    const blink = Math.sin(lt * 0.85) > 0.965 ? 1.6 : 12;
    n.eyeL.setAttribute("ry", (blink * s).toFixed(1));
    n.eyeR.setAttribute("ry", (blink * s).toFixed(1));
    const bo = clamp01((p - 0.35) / 0.25) * 0.75 * (1 - clamp01((p - 0.8) / 0.2) * 0.4);
    n.budL.setAttribute("opacity", bo.toFixed(2));
    n.budR.setAttribute("opacity", bo.toFixed(2));
    n.budL.setAttribute("transform", `translate(${168 * s} ${(cy - 60 + Math.sin(lt * 1.8 + 2) * 11) * s}) scale(0.55)`);
    n.budR.setAttribute("transform", `translate(${432 * s} ${(cy - 30 + Math.sin(lt * 1.9 + 4) * 11) * s}) scale(0.55)`);
  } else if (V.name === "wall") {
    n.bricks.forEach(b => {
      const q = easeOutBack(clamp01((lt - 0.04 - b.i * 0.045) / 0.3));
      b.g.setAttribute("opacity", clamp01(q * 1.5).toFixed(2));
      b.g.setAttribute("transform", `translate(0 ${((1 - clamp01(q)) * -26 * s).toFixed(1)})`);
    });
    n.crack.setAttribute("stroke-dashoffset", (n.crackLen * (1 - clamp01((p - 0.55) / 0.3))).toFixed(1));
    if (n.loose) {
      const wig = p > 0.72 ? Math.sin(lt * 7) * 2.6 : 0;
      n.loose.g.setAttribute("transform", `rotate(${wig.toFixed(2)} ${n.loose.cx} ${n.loose.cy})`);
    }
  } else if (V.name === "compass") {
    const ang = 150 * Math.exp(-2.0 * lt) * Math.sin(lt * 4.6);
    n.needle.setAttribute("transform", `rotate(${ang.toFixed(2)} ${300 * s} ${n.compCy * s})`);
    n.compGlow.setAttribute("opacity", (clamp01((p - 0.62) / 0.3) * (0.45 + 0.25 * Math.sin(lt * 4))).toFixed(2));
  } else {
    n.rays.setAttribute("transform", `rotate(${((lt * 14) % 360).toFixed(1)} ${300 * s} ${V.cy * s})`);
    const rq = (lt % 1.6) / 1.6;
    n.ring.setAttribute("r", ((40 + rq * 130) * s).toFixed(1));
    n.ring.setAttribute("opacity", (0.85 * (1 - rq)).toFixed(2));
    n.dot.setAttribute("r", ((26 + Math.sin(lt * 4) * 3) * s).toFixed(1));
  }
}

function buildProof(item) {
  // the receipt: a testimonial / screenshot card whose hot phrase is
  // highlighted AS it is spoken, with an optional counting number
  const root = el("item proof", stage);
  const zone = item.zone || [0.20, 0.86];
  root.style.paddingTop = Math.round(zone[0] * H) + "px";
  const card = el("pfcard", root);
  if (item.title) {
    const head = el("pfhead", card);
    const av = el("pfav", head);
    av.textContent = item.title.split(/\s+/).map(x => x[0]).join("").slice(0, 2).toUpperCase();
    av.style.background = item.accent || ACCENT;
    const tx = document.createElement("div");
    const nm = el("pfname", tx); nm.textContent = item.title;
    if (item.sub) {
      const rl = el("pfrole", tx);
      rl.textContent = item.sub.toUpperCase();
      rl.style.color = item.accent2 || "#38B6E3";
    }
    head.appendChild(tx);
  }
  let hotBoxEl = null;
  if (item.src) {
    const pim = el("pfimg", card);
    pim.style.height = "330px";
    const img = document.createElement("img");
    img.src = mediaSrc(item);
    pim.appendChild(img);
    if (item.hotBox) {
      hotBoxEl = el("pfhotbox", pim);
      const [hx, hy, hw, hh] = item.hotBox;
      hotBoxEl.style.cssText = `left:${(hx * 100).toFixed(1)}%;top:${(hy * 100).toFixed(1)}%;` +
        `width:${(hw * 100).toFixed(1)}%;height:${(hh * 100).toFixed(1)}%;` +
        `border-color:${item.accent2 || "#38E1FF"};background:${hexA(item.accent2 || "#38E1FF", .18)};opacity:0;`;
    }
  }
  const phrases = (item.phrases || []).map(ph => {
    const ln = el("pfline", card);
    let bar = null;
    if (ph.hot) {
      const wrap = document.createElement("span");
      wrap.className = "hotwrap";
      wrap.textContent = ph.text;
      bar = document.createElement("span");
      bar.className = "hotbar";
      bar.style.background = item.accent2 || "#38E1FF";
      wrap.appendChild(bar);
      ln.appendChild(wrap);
    } else {
      ln.textContent = ph.text;
    }
    return { el: ln, bar, at: ph.at };
  });
  let valEl = null;
  if (item.value != null) {
    const row = el("pfval", card);
    valEl = el("pfnum", row);
    valEl.style.color = item.accent2 || "#1FA855";
    valEl.textContent = "0";
    if (item.valueLabel || item.label) {
      const lab = el("pflab", row);
      lab.textContent = item.valueLabel || item.label;
    }
  }
  return { item, root, proofCard: card, proofPhrases: phrases,
           proofValEl: valEl, proofHotBox: hotBoxEl };
}

function buildPhone(item) {
  // a phone-frame screen insert: profile / screen recording that
  // SCROLLS under its own power while the speaker keeps talking
  const root = el("item phone", stage);
  const zone = item.zone || [0.10, 0.90];
  root.style.paddingTop = Math.round(zone[0] * H) + "px";
  const frameW = Math.round((item.w || 0.62) * W);
  const frame = el("phframe", root);
  frame.style.width = frameW + "px";
  const screen = el("phscreen", frame);
  const screenH = Math.round(frameW * 1.72);
  screen.style.height = screenH + "px";
  const img = document.createElement("img");
  img.src = mediaSrc(item);
  screen.appendChild(img);
  el("phnotch", screen);
  if (item.title) {
    const hd = el("phhandle", screen);
    hd.textContent = item.title;
  }
  const holder = { item, root, phoneFrame: frame, phoneImg: img, phoneMax: 0 };
  layoutJobs.push(() => {
    holder.phoneMax = Math.max(0, img.offsetHeight - screenH);
  });
  return holder;
}

function buildDoodle(item) {
  // hand-drawn annotation: a curved arrow that draws itself onto the
  // footage and points at the thing being talked about
  const root = el("item doodle", stage);
  const svg = svgEl("svg", { viewBox: "0 0 1080 1920", preserveAspectRatio: "none" }, root);
  const ac = item.accent || ACCENT;
  const x0 = (item.x != null ? item.x : 0.30) * W, y0 = (item.y != null ? item.y : 0.30) * H;
  const dir = item.flip ? -1 : 1;
  const x1 = x0 + dir * 210, y1 = y0 + 250;
  const d = `M ${x0} ${y0} C ${x0 + dir * 190} ${y0 + 30}, ${x0 + dir * 60} ${y0 + 190}, ${x1} ${y1}`;
  const path = svgEl("path", { d, fill: "none", stroke: ac, "stroke-width": 15,
    "stroke-linecap": "round", "stroke-dasharray": 460 }, svg);
  path.style.strokeDashoffset = 460;
  const head = svgEl("g", { opacity: 0 }, svg);
  svgEl("path", { d: `M ${x1} ${y1} l ${-dir * 52} ${-6} M ${x1} ${y1} l ${-14} ${-50}`,
    stroke: ac, "stroke-width": 15, fill: "none", "stroke-linecap": "round" }, head);
  let lab = null;
  if (item.title) {
    lab = el("ddlab", root);
    lab.textContent = item.title;
    lab.style.fontSize = (item.titleSize || 58) + "px";
    lab.style.left = Math.min(x0, x1) + "px";
    lab.style.top = (y0 - 92) + "px";
    lab.style.color = ac;
  }
  return { item, root, doodlePath: path, doodleHead: head, doodleLab: lab };
}

function buildCounter(item) {
  const root = el("item counter", stage);
  const { cy } = zoneCentre(item);
  const wrap = el("cwrap", root);
  wrap.style.top = Math.round(cy - 135) + "px";
  const num = el("num", wrap);
  num.style.color = item.accent || ACCENT;
  num.style.fontSize = "200px";
  if (item.prefix) { const s = document.createElement("span"); s.className = "affix"; s.textContent = item.prefix; num.appendChild(s); }
  const val = document.createElement("span");
  val.textContent = "0";
  num.appendChild(val);
  if (item.suffix) { const s = document.createElement("span"); s.className = "affix"; s.textContent = item.suffix; num.appendChild(s); }
  if (item.label) { const lab = el("clab", wrap); lab.textContent = item.label; }
  layoutJobs.push(() => {
    let fs = 200;
    while (num.scrollWidth > 950 && fs > 90) { fs -= 10; num.style.fontSize = fs + "px"; }
  });
  return { item, root, num, numVal: val, cwrap: wrap };
}

function buildDiagram(item) {
  // Full-bleed graphic of the four things her craft gives her. No pills,
  // badges, photos, fake proof or captions over a moving hand. A real
  // animated structure grows to each word in speech order.
  const root = el("item listp diagram", stage);
  const c = THEME.colors || {}, ac = c.listHead || item.accent || c.accent || ACCENT;
  const ink = item.ink || c.listText || c.sceneInk || "#FFFFFF";
  root.style.backgroundColor = item.bgColor || c.sceneBg || "#101319";
  const svg = svgEl("svg", { viewBox: "0 0 1080 1920", preserveAspectRatio: "xMidYMid meet" }, root);
  svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
  const font = PACKS[(THEME.fonts || {}).list] || "PackGrande";
  const rows = item.items || [], y0 = 805, y1 = 1480;
  const ys = rows.map((_, i) => y0 + i * (y1 - y0) / Math.max(1, rows.length - 1));
  // The immobile scaffold is low-contrast; the drawn rails are the
  // motion. Both colours follow the pre-edit colour chooser.
  const guide = hexA(ink, .17);
  svgEl("path", { d: `M 190 ${y0-90} V ${y1+95}`, fill: "none",
    stroke: guide, "stroke-width": 4 }, svg);
  svgEl("path", { d: `M 945 ${y0-90} V ${y1+95}`, fill: "none",
    stroke: guide, "stroke-width": 3, "stroke-dasharray": "5 17" }, svg);
  // the label is the clip's business, not the engine's: it is drawn
  // only when the timeline asks for it (item.label). A hard-coded
  // caption fought the running caption and split the sentence.
  const title = svgEl("text", { x: 108, y: 1692, fill: ink,
    "font-size": 66, "font-family": font, "font-weight": 600,
    "letter-spacing": 4 }, svg);
  const hasLabel = !!item.label;
  title.textContent = hasLabel ? item.label : "";
  const rule = svgEl("path", { d: "M 108 1725 H 630", fill: "none", stroke: ac,
    "stroke-width": 8, "stroke-dasharray": 522, "stroke-offset": 522 }, svg);
  if (!hasLabel) { title.setAttribute("opacity", "0"); rule.setAttribute("opacity", "0"); }
  const spineLen = (y1 + 95) - (y0 - 90);
  const spine = svgEl("line", { x1: 190, y1: y0-90, x2: 190, y2: y1+95,
    stroke: ac, "stroke-width": 8, "stroke-dasharray": spineLen,
    "stroke-dashoffset": spineLen }, svg);
  const built = rows.map((pl, i) => {
    const y = ys[i], group = svgEl("g", { opacity: 0 }, svg);
    const num = svgEl("text", { x: 100, y: y+28,
      fill: hexA(ink,.52), "font-size": 55, "font-family": "PackRegular",
      "letter-spacing": 2 }, group);
    num.textContent = String(i+1).padStart(2,"0");
    const dot = svgEl("circle", { cx: 190, cy: y, r: 0, fill: ac }, group);
    const label = svgEl("text", { x: 320, y: y+39,
      fill: ink, "font-size": 116, "font-family": font,
      "font-weight": 600, "letter-spacing": -1 }, group);
    label.textContent = pl.text.toUpperCase();
    fitSvg(label, 630);
    const bar = svgEl("path", { d: `M 190 ${y+86} H 945`, fill: "none",
      stroke: ac, "stroke-width": 6, "stroke-dasharray": 755,
      "stroke-dashoffset": 755 }, group);
    return { group, num, dot, label, bar, at: pl.at, y };
  });
  const rightLen = (y1+95)-(y0-90);
  const right = svgEl("path", { d: `M 945 ${y0-90} V ${y1+95}`,
    fill: "none", stroke: ac, "stroke-width": 8,
    "stroke-dasharray": rightLen, "stroke-dashoffset": rightLen }, svg);
  return { item, root, diagram: { ac, ink, ys, rows: built, spine, spineLen,
                                  right, rightLen, rule } };
}

function buildList(item) {
  if (item.layout === "diagram") return buildDiagram(item);
  const root = el("item listp", stage);
  const zone = item.zone || [0.50, 0.95];
  const wrap = el("lwrap", root);
  wrap.style.top = (zone[0] * H) + "px";
  let head = null;
  if (item.title) {
    head = el("lhead", wrap);
    head.textContent = item.title;
    head.style.background = item.accent || ACCENT;
    head.style.fontSize = "58px";
  }
  const plates = (item.items || []).map((pl, i) => {
    const pel = el("plate", wrap);
    const badge = el("badge", pel);
    badge.textContent = String(i + 1);
    badge.style.fontSize = "58px";
    const tx = el("ptx", pel);
    const t1 = el("pt1", tx); t1.textContent = pl.text; t1.style.fontSize = "64px";
    let t2 = null;
    if (pl.sub) { t2 = el("pt2", tx); t2.textContent = pl.sub; t2.style.fontSize = "58px"; }
    layoutJobs.push(() => {
      // shrink floor is the 3% rule (58px): plates grow, type doesn't sink
      let fs = 64;
      while (t1.scrollWidth > 700 && fs > 58) { fs -= 2; t1.style.fontSize = fs + "px"; }
    });
    return { el: pel, badge, at: pl.at };
  });
  return { item, root, plates, lhead: head, lwrap: wrap };
}

function buildProcess(item) {
  const root = el("item proc", stage);
  const { cy } = zoneCentre(item, [0.52, 0.92]);
  const wrap = el("pwrap", root);
  wrap.style.top = Math.round(cy) + "px";
  wrap.style.transform = "translateY(-50%)";
  if (item.title) {
    const t = el("ptitle", wrap);
    t.textContent = item.title;
    t.style.background = item.accent || ACCENT;
    t.style.fontSize = "58px";
  }
  const steps = (item.steps || []).map((st, i, arr) => {
    const row = el("srow", wrap);
    const col = el("scol", row);
    const circ = el("scirc", col);
    circ.textContent = String(i + 1);
    circ.style.fontSize = "58px";
    let line = null;
    if (i < arr.length - 1) line = el("sline", col);
    const tx = el("stx", row);
    const t1 = el("st1", tx); t1.textContent = st.text; t1.style.fontSize = "64px";
    if (st.sub) { const t2 = el("st2", tx); t2.textContent = st.sub; t2.style.fontSize = "58px"; }
    layoutJobs.push(() => {
      let fs = 64;
      while (t1.scrollWidth > 700 && fs > 58) { fs -= 2; t1.style.fontSize = fs + "px"; }
    });
    return { row, circ, line, at: st.at };
  });
  return { item, root, steps, pwrap: wrap };
}

function lifeFx(t, at, until, enterFrames) {
  // opacity resolves within 2 frames either side (semi-transparent QC);
  // the exit is the 8-frame slide+blur profile, opacity last 2 frames
  const opIn = clamp01((t - at) / (2 / FPS));
  const x = exitFade(until, t);
  return { op: Math.min(opIn, x.op), blur: x.blur, slide: x.slide,
           pIn: clamp01((t - at) / ((enterFrames || 10) / FPS)) };
}

function fmtVal(v, dec) {
  const parts = v.toFixed(dec).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.join(".");
}

function fitSvg(tx, maxW) {
  // SVG text cannot wrap: shrink its font-size (measured once fonts are
  // in, via layoutJobs) until it fits maxW px. Floor 40% of authored size.
  layoutJobs.push(() => {
    let fs = parseFloat(tx.getAttribute("font-size"));
    const floor = fs * 0.4;
    for (let i = 0; i < 24; i++) {
      if (tx.getComputedTextLength() <= maxW || fs <= floor) break;
      fs *= 0.94;
      tx.setAttribute("font-size", fs.toFixed(1));
    }
  });
}

function stackContentWidth(stack) {
  // The rows are flex containers: when the words are wider than the
  // row, the content OVERFLOWS the row box, so scrollWidth still
  // reports the row width and the old autofit never saw the spill.
  // Measure the words themselves instead.
  let widest = 0;
  for (const row of stack.children) {
    let w = 0;
    const kids = Array.from(row.children);
    for (const sp of kids) w += sp.offsetWidth;
    const gap = parseFloat(getComputedStyle(row).columnGap || "0") || 0;
    w += Math.max(0, kids.length - 1) * gap;
    widest = Math.max(widest, w);
  }
  return widest;
}

function fitStack(stack, maxFrac) {
  // shrink the whole stack until the widest row fits the frame
  const maxW = maxFrac * W;
  const natural = stackContentWidth(stack);
  if (!natural || natural <= maxW) { stack._fitScale = 1; return; }
  let scale = maxW / natural;
  scale = Math.max(0.45, scale);
  stack.style.transform = `scale(${scale})`;
  stack.style.transformOrigin = "50% 50%";
  stack._fitScale = scale;
}

function autofit(node, maxFrac, singleLine) {
  // shrink until the content fits the frame width (never touch the
  // edges); the shrink is capped so effective type never falls under
  // the 3% floor - a stack still overflowing at the cap is a QC
  // finding (author shorter words), never a silent shrink
  const maxW = maxFrac * W;
  let scale = 1;
  for (let i = 0; i < 24; i++) {
    const w = node.scrollWidth;
    if (w <= maxW || scale <= 0.62) break;
    scale *= 0.94;
    node.style.transform = `scale(${scale})`;
    node.style.transformOrigin = "50% 0";
    if (singleLine) node.style.transformOrigin = "50% 50%";
  }
  node._fitScale = scale;
}

/* ---------------- per-frame application --------------------------------- */
function wordEnter(wd, t) {
  // style for a word at time t (seconds); enters over 7f starting
  // WORD_LEAD (2 frames) before the authored speech onset. The entry
  // motion is the caption style (wd.entry): pop is the house default;
  // stretch/wiggle/glide/bounce are the dynamic set. All are pure
  // functions of the frame clock and none touches the opacity curve,
  // so the semi-transparent discipline is style-independent.
  const dt = t - (wd.at - WORD_LEAD);
  const enterF = 7 / FPS, p = clamp01(dt / enterF);
  const entry = wd.entry || "pop";
  let blur = 6 * (1 - easeOut(p));
  let y = 34 * (1 - easeOut(p));
  let x = 0;
  let rot = 1.6 * (1 - easeOut(p));
  const op = clamp01(dt / (2 / FPS));
  let scale = 1, sx = null, sy = null;
  if (entry === "impact") {          // print pop: sharp, no blur
    blur = 0; y = 12 * (1 - easeOut(p)); rot = 0;
  } else if (entry === "editorial") {  // flat print: settle, no pop
    blur = 0; y = 7 * (1 - easeOut(p)); rot = 0;
  } else if (entry === "glide") {           // slides in from the left, sharp
    x = -54 * (1 - easeOut(p)); y = 0; blur = 0; rot = 0;
  } else if (entry === "stretch") {  // rubber-band: wide -> true width
    sx = 0.45 + 0.55 * easeOutBack(p); sy = 1;
    blur = 3 * (1 - p); y = 10 * (1 - easeOut(p)); rot = 0;
  } else if (entry === "bounce") {   // drops in big, settles
    scale = 0.55 + 0.45 * easeOutBack(p);
    blur = 4 * (1 - p); y = 16 * (1 - easeOut(p));
  }
  if (entry === "wiggle" && dt > enterF)   // lands, then wiggles off
    rot += Math.sin((dt - enterF) * 22) * 2.6 * Math.exp(-(dt - enterF) * 5);
  if (wd.style !== "editorial"
      && (wd.kind === "key" || wd.kind === "neon" || wd.kind === "hero"
      || wd.kind === "mark" || wd.kind === "pay" || wd.kind === "grad")) {
    const pk = clamp01(dt / ((10 / THEME.speed) / FPS));
    scale = pk < 0.62 ? 0.85 + (1.08 - 0.85) * themeEase(pk / 0.62)
                     : 1.08 - 0.08 * themeEase((pk - 0.62) / 0.38);
    sx = sy = null;
  }
  if (wd.markerStyle && !["mark", "pay", "grad", "hero"].includes(wd.kind)) {
    // every marker word pops with overshoot, not just the key word:
    // the line itself performs (R4's word-by-word bounce)
    const pb = clamp01(dt / (8 / FPS));
    scale = Math.max(0.05, 0.55 + 0.45 * easeOutBack(pb));
    sx = sy = null;
  }
  return { blur, y, x, rot, op, scale, sx, sy };
}

function exitFade(endT, t) {
  // spec exit: 8 frames - 12 px slide + blur across all 8, opacity only
  // in the last 2 (a graphic is never semi-transparent >2 frames);
  // endT is the exit START; the element is fully gone at endT + 8f
  const dt = t - endT;
  const p = clamp01(dt / (8 / FPS));
  const op = dt <= 6 / FPS ? 1 : clamp01(1 - (dt - 6 / FPS) / (2 / FPS));
  return { blur: 6 * easeIn(p), slide: 12 * easeIn(p), op };
}

const WORD_LEAD = 2 / FPS;   // words appear 2 frames BEFORE the onset
function applyWord(wd, t, until) {
  const e = wordEnter(wd, t);
  // karaoke captions: the word being spoken right now lights up in the
  // accent and leans in 13%; it settles back to white when the next
  // word starts. Colour/scale only - opacity keeps its 2-frame entry/
  // exit discipline, so the semi-transparent QC is untouched. Key
  // words keep their plate (already the highlight of the stack).
  let karaNow = false;
  if (wd.kara && wd.kind !== "key" && wd.kind !== "hero"
      && wd.kind !== "mark" && wd.kind !== "pay" && wd.kind !== "grad") {
    // heroes never swell: a hero already fills its row, so the
    // karaoke 13% lean-in pushed MILLIONAIRE off-frame (user-
    // reported on test edit #1). Heroes keep colour + glow only.
    karaNow = t >= wd.at - WORD_LEAD && t < (wd.end ?? until);
    if (karaNow) {
      e.scale *= 1.13;
      if (e.sx != null) { e.sx *= 1.13; e.sy *= 1.13; }
    }
  }
  // a word always completes its entry first: its exit cannot start
  // until its (lead-shifted) pop has finished (blur cross-swap)
  const x = exitFade(Math.max(until, wd.at + 8 / FPS), t);
  const elx = wd.el;
  if (wd.kara && wd.kind !== "key" && wd.kind !== "neon" && wd.kind !== "hero"
      && wd.kind !== "mark" && wd.kind !== "pay" && wd.kind !== "grad")
    elx.style.color = karaNow ? (wd.ac || "#FF3355") : "";
  const glow = wd.el.dataset.glow === "1" || wd.kind === "key";
  let shadow = "0 6px 22px rgba(0,0,0,.45)";
  if (karaNow && wd.kind !== "neon")
    shadow = `0 0 34px ${hexA(wd.ac || "#FF3355", .85)}, 0 6px 22px rgba(0,0,0,.45)`;
  if (wd.kind === "key" || wd.kind === "hero" || wd.kind === "mark"
      || wd.kind === "pay" || wd.kind === "grad") {
    if (wd.style === "editorial") {
      // flat print: no shadow at all, the thin outline carries it
      shadow = "none";
    } else if (wd.style === "impact") {
      // reference print: hard offset shadow, never a coloured glow
      shadow = "0 5px 0 rgba(0,0,0,.55), 0 10px 24px rgba(0,0,0,.35)";
    } else {
      const dt = t - (wd.at - WORD_LEAD);
      const pulse = dt < 12 / FPS ? (0.55 + 0.45 * Math.sin((dt / (12 / FPS)) * Math.PI)) : 0.5;
      const c = wd.el.dataset.glowc || wd.el.style.color;
      shadow = `0 0 ${26 * pulse + 10}px ${c}, 0 6px 22px rgba(0,0,0,.4)`;
    }
  }
  if (wd.kind === "neon" || wd.finish === "neon") {
    // electric glow with a 4-frame flicker at entry (glow only - the
    // word's opacity curve stays clean for the semi-transparent QC)
    const f = Math.round((t - (wd.at - WORD_LEAD)) * FPS);
    const flick = f >= 3 && f <= 6 ? [0.45, 1, 0.6, 1][f - 3] : 1;
    const c = wd.el.style.color || wd.ac || "#FF3355";
    shadow = `0 0 ${Math.round(17 * flick)}px ${c}, 0 0 ${Math.round(46 * flick)}px ${c}, 0 6px 22px rgba(0,0,0,.45)`;
  }
  elx.style.opacity = Math.min(e.op, x.op).toFixed(3);
  elx.style.filter = `blur(${Math.max(e.blur, x.blur).toFixed(2)}px)`;
  elx.style.transform = `translate(${((e.x || 0)).toFixed(1)}px, ${(e.y + x.slide).toFixed(1)}px) ` +
    `rotate(${e.rot.toFixed(2)}deg) ` +
    `scale(${(e.sx != null ? e.sx : e.scale).toFixed(3)}, ${(e.sy != null ? e.sy : e.scale).toFixed(3)})`;
  elx.style.textShadow = shadow;
  if (wd.mkbar) {
    const q = easeOut(clamp01((t - (wd.at - WORD_LEAD)) / (6 / FPS)));
    wd.mkbar.style.transform = `scaleX(${q.toFixed(3)})`;
    wd.mkbar.style.opacity = Math.min(e.op, x.op).toFixed(3);
  }
  if (wd.sticker) {
    const q = easeOutBack(clamp01((t - wd.at) / (9 / FPS)));
    wd.sticker.style.transform =
      `scale(${Math.max(0.001, q).toFixed(3)}) rotate(${(-9 * (1 - clamp01(q))).toFixed(1)}deg)`;
    wd.sticker.style.opacity = clamp01((t - wd.at) / (2 / FPS)).toFixed(3);
  }
  trackSemi(elx, Math.min(e.op, x.op));
}

const stage = document.getElementById("stage");
function trackSemi(elx, op) {
  // per-element accounting: a single word may not linger semi-transparent
  // for more than 2 consecutive frames (spec QC); different words
  // crossfading through each other is the designed transition
  const semi = op > 0.04 && op < 0.96;
  elx._semiRun = semi ? (elx._semiRun || 0) + 1 : 0;
  elx._semiMax = Math.max(elx._semiMax || 0, elx._semiRun);
  if (stats && semi) stats.semiFrames++;
  if (stats) stats.semiMaxRun = Math.max(stats.semiMaxRun || 0, elx._semiMax);
}

function renderAt(tMs) {
  const t = tMs / 1000;
  stats = { semiFrames: 0, semiMaxRun: 0 };
  // outro fade to black over the tail of the clip
  const foEl = document.getElementById("fadeOverlay");
  if (foEl) {
    const dur = (TL && TL.duration) || 0;
    const fo = (TL && TL.fadeOut != null) ? TL.fadeOut : 0.45;
    const p = (dur > fo && t > dur - fo) ? clamp01((t - (dur - fo)) / fo) : 0;
    foEl.style.opacity = p.toFixed(3);
  }
  for (const b of builtItems) {
    const it = b.item;
    const active = t >= it.at - 0.001 - (b.words ? WORD_LEAD : 0) &&
                   t < (it.until ?? it.at + 2) + (it.hardOut ? 0 : 10 / FPS);
    b.root.style.display = active ? "" : "none";
    if (!active) continue;
    if (b.words) b.words.forEach(wd => applyWord(wd, t, it.until ?? it.at + 2));
    const dwell = Math.max(0.001, (it.until ?? it.at + 2) - it.at);
    const lifeP = clamp01((t - it.at) / dwell);
    // idle motion (spec: nothing fully static beyond 0.8 s): text
    // stacks breathe 100 -> 103% across their whole lifetime
    if (b.stack) {
      const drift = 1 + 0.03 * lifeP;
      if (b.sp3d) {
        // standing in the room: perspective tilt (rotY/rotX around the
        // authored anchor) + optional zoom-lock - when the camera
        // pushes 1.00 -> 1.05, author zoom [1, 1.05] and the word
        // scales with the room instead of floating over it
        const p3 = b.sp3d;
        const z = p3.zoom ? p3.zoom[0] + (p3.zoom[1] - p3.zoom[0]) * lifeP : 1;
        b.stack.style.transform =
          `perspective(${(p3.persp || 950).toFixed(0)}px) ` +
          `rotateY(${(p3.rotY || 0).toFixed(2)}deg) ` +
          `rotateX(${(p3.rotX || 0).toFixed(2)}deg) ` +
          `scale(${(((b.stack._fitScale || 1) * drift) * z).toFixed(4)})`;
      } else {
        b.stack.style.transform = `scale(${((b.stack._fitScale || 1) * drift).toFixed(4)})`;
      }
      b.stack.style.transformOrigin = "50% 50%";
    }
    if (b.bar) {
      const dt = t - it.at, until = it.until ?? it.at + 2;
      const wipe = clamp01(dt / (8 / FPS));          // mask wipe 8f
      const L = lifeFx(t, it.at, until, 8);
      b.bar.style.clipPath = `inset(-30% ${(1 - easeOut(wipe)) * 100}% -30% 0 round 999px)`;
      b.bar.style.filter = `blur(${(L.blur * 1.3).toFixed(2)}px)`;
      b.bar.style.opacity = L.op.toFixed(3);
      b.bar.style.transform = `translateY(${L.slide.toFixed(1)}px) scale(${(1 + 0.02 * lifeP).toFixed(4)})`;
      // entry streak rides the wipe; afterwards a shine sweep ~1.2 s
      let sweep = wipe, shine = wipe > 0 && wipe < 1;
      if (wipe >= 1) { const c = ((t - it.at) / 1.2) % 1; sweep = c; shine = c < 0.45; }
      b.streak.style.left = `${-30 + sweep * 150}%`;
      b.streak.style.opacity = shine ? 0.9 : 0;
      trackSemi(b.bar, L.op);
    }
    if (b.node) {
      const dt = t - it.at, dur = it.dur || 0.45;
      const p = clamp01(dt / dur);
      let op = 0, scale = 1;
      if (it.kind === "flash") op = p < 0.3 ? easeOut(p / 0.3) : 1 - easeIn((p - 0.3) / 0.7);
      else if (it.kind === "flare") { op = Math.sin(p * Math.PI); }   // leak peak sits on the cut
      else if (it.kind === "leak") { op = Math.sin(p * Math.PI) * 0.85; b.node.style.left = `${-20 + p * 120}%`; }
      b.node.style.opacity = (op * (it.strength || 1)).toFixed(3);
      if (it.kind === "flare") b.node.style.transform =
        `translate(${(-2 + p * 4).toFixed(2)}%, ${(-1 + p * 2).toFixed(2)}%) scale(1.06)`;
    }
    if (b.lower) {
      const until = it.until ?? it.at + 2;
      const pin = easeOut(clamp01((t - it.at) / (10 / FPS)));
      // dissolve exactly AT until, gone in 2 frames (the vector law -
      // no exit overhang over whatever comes next)
      const xq = clamp01((t - until) / (2 / FPS));
      const op = Math.min(clamp01((t - it.at) / (2 / FPS)), 1 - xq);
      b.lower.style.opacity = op.toFixed(3);
      // idle life (QC law: nothing fully static >0.8s): a slow drift
      // plus a shine sweep across the plate every 1.2s, chip-style
      b.lower.style.transform =
        `translateX(${(-112 * (1 - pin) - 10 * xq).toFixed(1)}%) ` +
        `scale(${(1 + 0.012 * lifeP).toFixed(4)})`;
      if (b.ltStreak) {
        const c = ((t - it.at) / 1.2) % 1;
        b.ltStreak.style.left = `${-30 + c * 150}%`;
        b.ltStreak.style.opacity = pin >= 1 && c < 0.45 ? 0.9 : 0;
      }
      trackSemi(b.lower, op);
    }
    if (b.slate) {
      // hook slate / end card: lines stagger in over ~6f each,
      // slate drifts (idle law), dissolves exactly AT until in 2f
      const until = it.until ?? it.at + 1.2;
      // the slate itself comes up hard - the lines stagger in over 2
      // frames each (QC: no semi-transparent text for more than 2
      // frames). The resolution is the picture's fade to black, not a
      // slow dissolve of the card.
      const op = Math.min(clamp01((t - it.at) / (2 / FPS)),
                          clamp01(1 - (t - until) / (2 / FPS)));
      b.slate.style.opacity = op.toFixed(3);
      b.slate.style.transform = `scale(${(1 + 0.03 * lifeP).toFixed(4)})`;
      (b.hkLines || []).forEach((ln, i) => {
        const p = easeOut(clamp01((t - it.at - i * 0.09) / (6 / FPS)));
        ln.style.opacity = clamp01((t - it.at - i * 0.09) / (2 / FPS)).toFixed(3);
        ln.style.transform = `translateY(${((1 - p) * 34).toFixed(1)}px)`;
      });
      trackSemi(b.slate, op);
    }
    if (b.item.type === "card") {
      const until = it.until ?? it.at + 2;
      const inP = clamp01((t - it.at) / (2 / FPS));   // bg snaps in 2f (no ghosting)
      const L = lifeFx(t, it.at, until, 8);
      b.root.style.opacity = Math.min(inP, L.op).toFixed(3);
      b.root.style.transform = `scale(${(1 + 0.03 * lifeP).toFixed(4)})`;
    }
    if (b.pipCard) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      b.pipCard.style.opacity = L.op.toFixed(3);
      b.pipCard.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      b.pipCard.style.transform = `translateY(${((1 - easeOut(L.pIn)) * 46 + L.slide).toFixed(1)}px) ` +
        `rotate(${(-1.4 * (1 - easeOut(L.pIn))).toFixed(2)}deg) ` +
        `scale(${((0.88 + 0.12 * easeOut(L.pIn)) * (1 + 0.02 * lifeP)).toFixed(3)})`;
      b.pipImg.style.transform = `scale(${(1.0 + 0.08 * lifeP).toFixed(3)})`;  // 100->108 push-in
      trackSemi(b.pipCard, L.op);
    }
    if (b.win) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      if (b.bfull) {
        if (b.vec) {
          // Vector vehicles: clean 2f dissolve in/out, nothing else. The
          // shared exit profile (6px blur + 12px slide while opacity holds,
          // then a 2f plunge) smears a full-screen SVG into a ghost flash
          // on exit - viewers read it as the scene "glitching back" for a
          // microsecond. NO fractional scales either: a scaled SVG layer
          // makes headless Chromium mis-sample raster tiles (ghost copies
          // of the scene stamped into wrong tiles, seen on `network`).
          // The scene animates internally; it needs no photo push-in.
          // Exit timing matters as much as the profile: the shared
          // exitFade holds opacity at 1 for 6f PAST until and only then
          // dissolves, so the scene melts over the NEXT item's first
          // frames - a full-screen ghost hanging over the new caption
          // (seen on chat: beat ended 23.04, ghost dissolved at 23.27
          // over the incoming poster). A vector scene instead dissolves
          // AT until and is gone within 2f; the beat boundary is exact.
          // HARD CUT in and out. The old 2-frame dissolve let the
          // footage underneath show through: the scene's nodes landed
          // ON the speaker's face for ~66ms, which read as a ghost
          // overlay (v5, "connection" beat). A full-screen scene is an
          // interstitial: it replaces the frame on a cut, like the
          // reference clips. `softIn` opts back into the dissolve.
          b._vecOp = it.softIn
            ? Math.min(clamp01((t - it.at) / (2 / FPS)),
                       clamp01(1 - (t - until) / (2 / FPS)))
            : (t >= it.at && t < until ? 1 : 0);
          b.win.style.opacity = b._vecOp.toFixed(3);
          b.win.style.filter = "none";
          b.win.style.transform = "none";
          b.bimg.style.transform = "none";
        } else {
          b.win.style.opacity = L.op.toFixed(3);
          b.win.style.filter = `blur(${(L.blur).toFixed(2)}px)`;
          b.win.style.transform = `translateY(${L.slide.toFixed(1)}px) scale(${(1 + 0.015 * lifeP).toFixed(4)})`;
          b.bimg.style.transform = `scale(${(1.0 + 0.08 * lifeP).toFixed(3)})`;  // 100->108 push-in
        }
      } else {
        const p = easeOut(L.pIn);
        b.win.style.clipPath = `inset(${((1 - p) * 44).toFixed(2)}% ${((1 - p) * 10).toFixed(2)}% ` +
          `${((1 - p) * 44).toFixed(2)}% ${((1 - p) * 10).toFixed(2)}% round 40px)`;
        b.win.style.opacity = L.op.toFixed(3);
        b.win.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
        b.win.style.transform = `translateY(${L.slide.toFixed(1)}px)`;
        b.bimg.style.transform = `scale(${(1.0 + 0.08 * lifeP).toFixed(3)}) translateX(${(-1.6 + 3.2 * lifeP).toFixed(2)}%)`;
      }
      if (b.bubbles) b.bubbles.forEach(mb => {
        const dt = t - mb.at;
        mb.el.style.opacity = clamp01(dt / (2 / FPS)).toFixed(3);
        mb.el.style.transform = `translateY(${((1 - easeOut(clamp01(dt / (7 / FPS)))) * 26).toFixed(1)}px) ` +
          `scale(${(0.85 + 0.15 * easeOutBack(clamp01(dt / (7 / FPS)))).toFixed(3)})`;
      });
      if (b.bvid) b.bvid.dataset.seek =
        Math.max(0, Math.min((it.until ?? it.at + 2) - it.at, t - it.at)).toFixed(3);
      trackSemi(b.win, b._vecOp !== undefined ? b._vecOp : L.op);
    }
    if (b.vec) animateVector(b, t, lifeP);
    if (b.num) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 6);
      const cd = it.countDur || 0.9;
      const p = clamp01((t - it.at) / cd);
      b.numVal.textContent = fmtVal((it.value || 0) * easeOut(p), it.decimals || 0);
      let sc = 0.92 + 0.08 * easeOut(clamp01((t - it.at) / (6 / FPS)));
      if (p >= 1) {   // landing pulse 100 -> 106 -> 100 over 6 frames
        const q = clamp01((t - it.at - cd) / (6 / FPS));
        sc *= 1 + 0.06 * Math.sin(q * Math.PI);
        // then a slow glow pulse keeps the landed number alive
        const gp = 0.5 + 0.5 * Math.sin(((t - it.at - cd) / 1.2) * Math.PI * 2);
        b.num.style.textShadow = `0 0 ${(18 + 22 * gp).toFixed(0)}px ${hexA(it.accent || ACCENT, .55)}, ` +
          `0 10px 34px rgba(0,0,0,.45)`;
      }
      b.num.style.opacity = L.op.toFixed(3);
      b.num.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      b.num.style.transform = `scale(${sc.toFixed(3)})`;
      if (b.cwrap) {   // the label exits with the number (slide + same profile)
        b.cwrap.style.opacity = L.op.toFixed(3);
        b.cwrap.style.transform = `translateY(${L.slide.toFixed(1)}px)`;
      }
      trackSemi(b.num, L.op);
    }
    if (b.diagram) {
      const dg = b.diagram, rows = dg.rows;
      // A hard cut out (hardOut) is used for this full-bleed variant.
      b.root.style.opacity = "1";
      b.root.style.filter = "none";
      b.root.style.transform = "none";
      dg.rule.setAttribute("stroke-dashoffset", (522 * (1 - easeOut(clamp01((t-it.at)/0.48)))).toFixed(1));
      let y = dg.ys[0] - 90;
      const latest = rows.reduce((index, row, i) => t >= row.at ? i : index, -1);
      rows.forEach((row, i) => {
        const dt = t - row.at, p = easeOut(clamp01(dt / 0.26));
        if (dt >= 0) {
          y = (i === 0 ? dg.ys[0] - 90 : dg.ys[i-1]) +
              (dg.ys[i] - (i === 0 ? dg.ys[0]-90 : dg.ys[i-1])) * easeInOut(clamp01(dt / 0.48));
        }
        row.group.setAttribute("opacity", dt < 0 ? "0" : p.toFixed(3));
        row.group.setAttribute("transform", `translate(0 ${((1-p)*22).toFixed(1)})`);
        row.bar.setAttribute("stroke-dashoffset", (755*(1-easeInOut(clamp01((dt-.08)/.50)))).toFixed(1));
        row.dot.setAttribute("r", dt < 0 ? "0" :
          (i === latest ? 18 + 3*Math.sin((t-row.at)*5) : 13).toFixed(1));
        row.label.setAttribute("fill", i === latest ? dg.ac : dg.ink);
        row.label.setAttribute("opacity", i === latest ? "1" : ".72");
        row.bar.setAttribute("opacity", i === latest ? "1" : ".32");
      });
      // Between spoken labels, the rail visibly travels toward the
      // next empty anchor (an open loop). The label still waits for its
      // actual acoustic onset; there is no 320ms text spoiler.
      if (latest >= 0 && latest < rows.length - 1) {
        const cur = rows[latest], next = rows[latest+1];
        const span = Math.max(.01, next.at - cur.at - .38);
        const q = easeInOut(clamp01((t - cur.at - .38) / span));
        y = Math.max(y, cur.y + (next.y-cur.y) * q * .88);
      }
      const px = Math.max(0, Math.min(dg.spineLen, y-(dg.ys[0]-90)));
      dg.spine.setAttribute("stroke-dashoffset", (dg.spineLen-px).toFixed(1));
      const last = rows[rows.length-1];
      const rp = last ? easeInOut(clamp01((t-last.at-.08)/.55)) : 0;
      dg.right.setAttribute("stroke-dashoffset", (dg.rightLen*(1-rp)).toFixed(1));
    }
    if (b.plates) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until, t);
      b.root.style.opacity = x.op.toFixed(3);
      b.root.style.filter = `blur(${(x.blur * 1.2).toFixed(2)}px)`;
      b.root.style.transform = `translateY(${x.slide.toFixed(1)}px)`;
      if (b.lwrap) b.lwrap.style.transform = `scale(${(1 + 0.02 * lifeP).toFixed(4)})`;
      if (b.lhead) b.lhead.style.opacity = clamp01((t - it.at) / (2 / FPS)).toFixed(3);
      let lastStarted = -1;
      b.plates.forEach((pl, i) => { if (t >= pl.at) lastStarted = i; });
      b.plates.forEach((pl, i) => {
        const dt = t - pl.at;
        const p = easeOut(clamp01(dt / (7 / FPS)));
        const op = clamp01(dt / (2 / FPS));
        pl.el.style.opacity = op.toFixed(3);
        pl.el.style.transform = `translateX(${(-70 * (1 - p)).toFixed(1)}px)`;
        pl.el.style.filter = `blur(${(5 * (1 - p)).toFixed(2)}px)`;
        const active = i === lastStarted;
        pl.badge.style.background = active ? (it.accent || ACCENT) : "rgba(255,255,255,.16)";
        pl.badge.style.color = active ? "#0d0f12" : "#ffffff";
        trackSemi(pl.el, op);
      });
    }
    if (b.steps) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until, t);
      b.root.style.opacity = x.op.toFixed(3);
      b.root.style.filter = `blur(${(x.blur * 1.2).toFixed(2)}px)`;
      b.root.style.transform = `translateY(${x.slide.toFixed(1)}px)`;
      if (b.pwrap) b.pwrap.style.transform =
        `translateY(-50%) scale(${(1 + 0.02 * lifeP).toFixed(4)})`;
      let lastStarted = -1;
      b.steps.forEach((s, i) => { if (t >= s.at) lastStarted = i; });
      b.steps.forEach((s, i) => {
        const dt = t - s.at;
        const p = easeOut(clamp01(dt / (7 / FPS)));
        const op = clamp01(dt / (2 / FPS));
        s.row.style.opacity = op.toFixed(3);
        s.row.style.transform = `translateY(${(26 * (1 - p)).toFixed(1)}px)`;
        if (i < lastStarted) {
          s.circ.textContent = "✓";
          s.circ.style.background = "rgba(255,255,255,.14)";
          s.circ.style.color = "#ffffff";
          s.circ.style.border = `3px solid ${hexA(it.accent || ACCENT, .85)}`;
          s.circ.style.boxShadow = "none";
        } else if (i === lastStarted) {
          s.circ.textContent = String(i + 1);
          s.circ.style.background = it.accent || ACCENT;
          s.circ.style.color = "#0d0f12";
          s.circ.style.border = "3px solid transparent";
          s.circ.style.boxShadow = `0 0 30px ${hexA(it.accent || ACCENT, .55)}`;
        } else {
          s.circ.textContent = String(i + 1);
          s.circ.style.background = "transparent";
          s.circ.style.color = "rgba(255,255,255,.55)";
          s.circ.style.border = "3px solid rgba(255,255,255,.3)";
          s.circ.style.boxShadow = "none";
        }
        if (s.line) s.line.style.background = i < lastStarted ? (it.accent || ACCENT) : "rgba(255,255,255,.18)";
        trackSemi(s.row, op);
      });
    }
    if (b.proofCard) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      b.proofCard.style.opacity = L.op.toFixed(3);
      b.proofCard.style.filter = `blur(${(L.blur * 1.3).toFixed(2)}px)`;
      b.proofCard.style.transform = `translateY(${((1 - easeOut(L.pIn)) * 52 + L.slide).toFixed(1)}px) ` +
        `scale(${((0.92 + 0.08 * easeOut(L.pIn)) * (1 + 0.015 * lifeP)).toFixed(3)})`;
      (b.proofPhrases || []).forEach(ph => {
        const dt = t - ph.at;
        ph.el.style.opacity = clamp01(dt / (2 / FPS)).toFixed(3);
        ph.el.style.transform = `translateY(${((1 - easeOut(clamp01(dt / (7 / FPS)))) * 22).toFixed(1)}px)`;
        // the highlight lands WITH the spoken phrase, then stays
        if (ph.bar) ph.bar.style.transform =
          `scaleX(${easeOut(clamp01((t - ph.at) / 0.35)).toFixed(3)})`;
      });
      if (b.proofValEl) {
        const cd = it.countDur || 0.9;
        const p = clamp01((t - it.at) / cd);
        b.proofValEl.textContent = (it.prefix || "") +
          fmtVal((it.value || 0) * easeOut(p), it.decimals || 0) + (it.suffix || "");
      }
      if (b.proofHotBox) {
        const q = it.hotAt != null ? easeOut(clamp01((t - it.hotAt) / 0.3)) : 0;
        b.proofHotBox.style.opacity = (0.92 * q).toFixed(3);
        b.proofHotBox.style.transform = `scale(${(0.94 + 0.06 * q).toFixed(3)})`;
      }
      trackSemi(b.proofCard, L.op);
    }
    if (b.phoneFrame) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      b.phoneFrame.style.opacity = L.op.toFixed(3);
      b.phoneFrame.style.filter = `blur(${(L.blur * 1.3).toFixed(2)}px)`;
      b.phoneFrame.style.transform = `translateY(${((1 - easeOut(L.pIn)) * 56 + L.slide).toFixed(1)}px) ` +
        `scale(${(0.92 + 0.08 * easeOut(L.pIn)).toFixed(3)})`;
      if (b.phoneImg) {
        // scroll starts after the entry settles, eases to its depth
        const p = easeInOut(clamp01((t - it.at - 0.35) /
                                    Math.max(0.001, (until - it.at) - 0.7)));
        b.phoneImg.style.transform =
          `translateY(${(-(b.phoneMax || 0) * (it.scroll != null ? it.scroll : 0.7) * p).toFixed(1)}px)`;
      }
      trackSemi(b.phoneFrame, L.op);
    }
    if (b.doodlePath) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until, t);
      const op = Math.min(clamp01((t - it.at) / (2 / FPS)), x.op);
      b.root.style.opacity = op.toFixed(3);
      const q = easeInOut(clamp01((t - it.at) / 0.55));
      b.doodlePath.style.strokeDashoffset = (460 * (1 - q)).toFixed(1);
      if (b.doodleHead) b.doodleHead.setAttribute("opacity",
        clamp01((q - 0.82) / 0.18).toFixed(2));
      if (b.doodleLab) {
        b.doodleLab.style.opacity = clamp01((q - 0.45) / 0.3).toFixed(3);
        b.doodleLab.style.transform =
          `translateY(${((1 - easeOut(clamp01((q - 0.45) / 0.3))) * 16).toFixed(1)}px)`;
      }
      trackSemi(b.doodlePath, op);
    }
  }
  return stats;
}

window.syncVideos = function () {
  // deterministic media sync for video B-roll: every <video> is
  // seeked to the frame clock's local time and we wait for the seek
  // to land before the screenshot (render.mjs awaits this per frame)
  const jobs = [];
  for (const b of builtItems) {
    if (!b.bvid) continue;
    const v = b.bvid, want = parseFloat(v.dataset.seek || "0");
    if (v.readyState >= 1 && Math.abs((v.currentTime || 0) - want) > 1 / 30) {
      jobs.push(new Promise(res => {
        let done = false;
        const fin = () => { if (!done) { done = true; res(1); } };
        v.addEventListener("seeked", fin, { once: true });
        setTimeout(fin, 350);
        try { v.currentTime = want; } catch (e) { fin(); }
      }));
    }
  }
  return Promise.all(jobs);
};

window.setTimeline = function (tl) {
  TL = tl;
  ACCENT = (tl.brand && tl.brand.accent) || ACCENT;
  if (tl.theme) THEME = Object.assign({}, THEME, tl.theme);
  const rad = { sharp: "6px", round: "26px", pill: "999px" }[THEME.radius] || "26px";
  let st = document.getElementById("themeStyle");
  if (!st) { st = document.createElement("style"); st.id = "themeStyle"; document.head.appendChild(st); }
  st.textContent =
    `.chip .bar, .listp .plate, .proc .srow, .card, .pip .pcard { border-radius: ${rad} !important; }` +
    (THEME.fontMode === "serif"
      ? `.poster .w, .card .cw { font-family: "SerifX"; font-style: italic; }` : "") +
    // adaptive caption shade (produce.py measures the caption-zone
    // luminance and raises this on bright footage): deepens the
    // stack's ground plate so words hold 4.5:1 anywhere
    (THEME.captionShade > 0
      ? `.poster .stack::before { background: radial-gradient(ellipse at center, rgba(4,7,10,${Math.min(0.92, 0.55 + THEME.captionShade).toFixed(2)}) 55%, rgba(4,7,10,0) 88%) !important; }` : "") +
    // font pack (theme fontPack / produce --font): one display face
    // across posters, cards, slates, chips, lower-thirds, counters.
    // Serif-italic WORDS keep SerifX - that contrast is a meaning
    // cue (reflective), not a style accident.
    (PACKS[THEME.fontPack]
      ? `.poster .w, .card .cw, .slate .hk-line, .slate .hk-kicker, .slate .hk-sub, .chip .t1, .lowerthird .ltname, .counter .num { font-family: "${PACKS[THEME.fontPack]}" !important; }` : "") +
    // ---- style card: per-ROLE fonts (one video, several voices) -------
    // caption / keyword / serif / endcard / list each take their own
    // face. The whole-video pack above paints the base; these rules
    // are more specific and land last, so a role always wins.
    roleFontCss() +
    // ---- style card: per-ROLE colours --------------------------------
    // keyword colour, plate colour + ink, caption text colour, list
    // colours, and the full-bleed scene ground/ink (REF1 runs white
    // scenes with dark type - the ground is a choice, not a constant).
    roleColorCss();
  stage.innerHTML = "";
  // fade-to-black overlay: the outro fade lives in the engine so every
  // clip ends the same way, whatever the timeline asked for.
  const fo = document.createElement("div");
  fo.id = "fadeOverlay";
  fo.style.cssText = "position:absolute;inset:0;background:#000;opacity:0;" +
                     "z-index:60;pointer-events:none;";
  stage.appendChild(fo);
  builtItems = [];
  layoutJobs.length = 0;
  const builders = { poster: buildPoster, chip: buildChip, card: buildCard, fx: buildFx,
                     pip: buildPip, broll: buildBroll, counter: buildCounter,
                     list: buildList, process: buildProcess, vector: buildVector,
                     proof: buildProof, phone: buildPhone, doodle: buildDoodle,
                     lowerthird: buildLower, hook: buildHook, endcard: buildEndcard };
  for (const item of tl.items || []) {
    if (item.type === "fx" && item.until == null) item.until = item.at + (item.dur || 0.45);
    const b = builders[item.type];
    if (b) builtItems.push(b(item));
  }
  return builtItems.length;
};
window.renderAt = renderAt;
window.layoutStage = function () {
  // run once fonts are in: autofit must measure with real metrics
  for (const job of layoutJobs) job();
  return layoutJobs.length;
};
</script>
</body>
</html>
