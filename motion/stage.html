<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "MontserratX"; src: url("file:///home/user/system/assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
  @font-face { font-family: "MontserratX"; src: url("file:///home/user/system/assets/fonts/Montserrat-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "SerifX"; src: url("file:///home/user/system/assets/fonts/DejaVuSerif-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "SerifX"; src: url("file:///home/user/system/assets/fonts/DejaVuSerif.ttf"); font-weight: 400; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #stage { position: absolute; inset: 0; }
  .item { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

  /* ---- poster captions ---- */
  .poster { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .poster .stack { display: flex; flex-direction: column; align-items: center; position: relative; }
  /* soft dark plate under the stack (spec 1.6): an invisible-feeling
     radial falloff that guarantees the 4.5:1 ground on bright footage */
  .poster .stack::before { content: ""; position: absolute; inset: -30px -56px; z-index: -1;
    border-radius: 999px;
    background: radial-gradient(ellipse at center, rgba(4,7,10,.55) 55%, rgba(4,7,10,0) 88%); }
  .poster .row { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; }
  .poster .w { display: inline-block; color: #fff; font-family: "MontserratX"; font-weight: 800;
               -webkit-text-stroke: 3px rgba(0,0,0,.6); paint-order: stroke fill;
               text-shadow: 0 6px 22px rgba(0,0,0,.45); will-change: transform, filter, opacity; }
  .poster .w.conn { font-weight: 800; letter-spacing: .02em; }
  .poster .w.serif { font-family: "SerifX"; font-style: italic; font-weight: 700; -webkit-text-stroke: 3px rgba(0,0,0,.55); }
  .poster .w.key { font-weight: 800; letter-spacing: .015em; transform-origin: 50% 60%; }

  /* ---- label chip ---- */
  .chip { display: flex; align-items: center; justify-content: center; }
  .chip .bar { position: relative; display: flex; align-items: center; gap: 22px;
               border-radius: 999px; padding: 27px 40px 27px 28px; overflow: hidden;
               box-shadow: 0 18px 50px rgba(0,0,0,.45); will-change: clip-path, filter, opacity, transform; }
  .chip .ic { flex: 0 0 auto; width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; }
  .chip .ic svg { width: 62px; height: 62px; }
  .chip .tx { display: flex; flex-direction: column; }
  .chip .t1 { font-family: "MontserratX"; font-weight: 800; color: #0d0f12; letter-spacing: .01em; line-height: 1.04; white-space: nowrap; }
  .chip .t2 { font-family: "MontserratX"; font-weight: 600; color: rgba(13,15,18,.72); line-height: 1.1; white-space: nowrap; }
  .chip .streak { position: absolute; top: -20%; bottom: -20%; width: 120px; transform: skewX(-18deg);
                  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }

  /* ---- full-screen text card ---- */
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card .cw { display: inline-block; font-family: "MontserratX"; font-weight: 800; color: #fff;
              -webkit-text-stroke: 3px rgba(0,0,0,.55); paint-order: stroke fill;
              text-shadow: 0 6px 22px rgba(0,0,0,.4);
              letter-spacing: .01em; will-change: transform, filter, opacity; }
  .card .cw.serif { font-family: "SerifX"; font-style: italic; font-weight: 700; }
  .card .cline { display: flex; justify-content: center; align-items: baseline; white-space: nowrap; }

  .poster .w.neon, .card .cw.neon { font-weight: 800; letter-spacing: .015em; }

  /* ---- PiP / proof card ---- */
  .pip { display: flex; align-items: flex-start; justify-content: center; }
  .pip .pcard { position: relative; background: #fff; border-radius: 34px; padding: 14px;
                box-shadow: 0 26px 64px rgba(0,0,0,.5); will-change: transform, filter, opacity; }
  .pip .pimg { border-radius: 22px; overflow: hidden; position: relative; }
  .pip .pimg img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .pip .plab { position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column;
               background: rgba(8,10,13,.85); border-radius: 20px; padding: 16px 26px; max-width: 400px; }
  .pip .plab .l1 { font-family: "MontserratX"; font-weight: 800; color: #fff; line-height: 1.05; }
  .pip .plab .l2 { font-family: "MontserratX"; font-weight: 600; color: rgba(255,255,255,.72); line-height: 1.15; white-space: nowrap; }
  .tagill { position: absolute; top: -20px; right: 28px; z-index: 3; font-family: "MontserratX"; font-weight: 800;
            letter-spacing: .14em; padding: 10px 20px; border-radius: 999px; box-shadow: 0 10px 26px rgba(0,0,0,.35); }

  /* ---- B-roll window ---- */
  .broll .win { position: absolute; overflow: hidden; border-radius: 40px;
                box-shadow: 0 30px 80px rgba(0,0,0,.55); will-change: clip-path, filter, opacity; }
  .broll .win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .broll .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
                  background: linear-gradient(180deg, transparent, rgba(0,0,0,.66)); }
  .broll .blab { position: absolute; left: 42px; bottom: 36px; display: flex; flex-direction: column; max-width: 760px; }
  .broll .blab .l1 { font-family: "MontserratX"; font-weight: 800; color: #fff; line-height: 1.04;
                     text-shadow: 0 4px 18px rgba(0,0,0,.5); }
  .broll .blab .l2 { font-family: "MontserratX"; font-weight: 600; color: rgba(255,255,255,.8);
                     line-height: 1.15; white-space: nowrap; }
  .broll .tagill { top: 24px; right: 24px; }

  /* ---- number counter ---- */
  .counter { position: absolute; inset: 0; }
  .counter .cwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .counter .cwrap::before { content: ""; position: absolute; inset: -34px 90px; z-index: -1;
    border-radius: 999px;
    background: radial-gradient(ellipse at center, rgba(4,7,10,.52) 55%, rgba(4,7,10,0) 88%); }
  .counter .num { font-family: "MontserratX"; font-weight: 800; letter-spacing: .005em;
                  text-shadow: 0 10px 34px rgba(0,0,0,.45); will-change: transform, opacity, filter; white-space: nowrap; }
  .counter .num .affix { font-size: .44em; }
  .counter .clab { font-family: "MontserratX"; font-weight: 800; color: #fff; letter-spacing: .14em;
                   font-size: 58px; -webkit-text-stroke: 2px rgba(0,0,0,.5); paint-order: stroke fill;
                   text-shadow: 0 4px 16px rgba(0,0,0,.55); margin-top: 14px; white-space: nowrap; }

  /* ---- list plates ---- */
  .listp { position: absolute; inset: 0; }
  .listp .lwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .listp .lhead { font-family: "MontserratX"; font-weight: 800; letter-spacing: .08em; color: #0d0f12;
                  padding: 18px 38px; border-radius: 999px; box-shadow: 0 14px 36px rgba(0,0,0,.4); white-space: nowrap; }
  .listp .plate { display: flex; align-items: center; gap: 26px; background: rgba(9,11,15,.88); border-radius: 26px;
                  padding: 26px 38px 26px 28px; box-shadow: 0 16px 44px rgba(0,0,0,.42); will-change: transform, opacity, filter; }
  .listp .badge { flex: 0 0 auto; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center;
                  justify-content: center; font-family: "MontserratX"; font-weight: 800; }
  .listp .ptx { display: flex; flex-direction: column; }
  .listp .pt1 { color: #fff; font-family: "MontserratX"; font-weight: 800; line-height: 1.05; white-space: nowrap; }
  .listp .pt2 { color: rgba(255,255,255,.66); font-family: "MontserratX"; font-weight: 600; line-height: 1.15; white-space: nowrap; }

  /* ---- process / step stack ---- */
  .proc { position: absolute; inset: 0; }
  .proc .pwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .proc .ptitle { font-family: "MontserratX"; font-weight: 800; letter-spacing: .08em; color: #0d0f12;
                  padding: 18px 38px; border-radius: 999px; box-shadow: 0 14px 36px rgba(0,0,0,.4);
                  margin-bottom: 34px; white-space: nowrap; }
  .proc .srow { display: flex; align-items: flex-start; gap: 28px; will-change: transform, opacity, filter;
                background: rgba(9,11,15,.82); border-radius: 26px; padding: 22px 34px 22px 26px; }
  .proc .scol { display: flex; flex-direction: column; align-items: center; }
  .proc .scirc { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                 font-family: "MontserratX"; font-weight: 800; flex: 0 0 auto; }
  .proc .sline { width: 6px; height: 40px; border-radius: 3px; margin: 8px 0; }
  .proc .stx { display: flex; flex-direction: column; padding-top: 6px; min-width: 430px; }
  .proc .st1 { color: #fff; font-family: "MontserratX"; font-weight: 800; line-height: 1.05; white-space: nowrap;
               text-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .proc .st2 { color: rgba(255,255,255,.7); font-family: "MontserratX"; font-weight: 600; line-height: 1.2; white-space: nowrap; }

  /* ---- light fx ---- */
  .fxlayer { position: absolute; inset: 0; overflow: hidden; }
  .fx-flash { position: absolute; inset: 0; }
  /* full-frame diagonal light leak (screen-style wash), never a blob */
  .fx-flare { position: absolute; inset: -12%; will-change: opacity, transform; }
  .fx-leak { position: absolute; top: -30%; bottom: -30%; width: 46%; transform: rotate(16deg); filter: blur(30px); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const FPS = 30, W = 1080, H = 1920;
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeIn = t => t * t;
const easeInOut = t => t * t * (3 - 2 * t);
const fmt = v => fmtVal(v, 0);
const F = s => Math.round(s * FPS); // seconds -> frames

let TL = null, builtItems = [], ACCENT = "#FFC531", stats = null;
let THEME = { radius: "round", glow: 1, speed: 1, easing: "pop", fontMode: "sans" };
function themeEase(p) {
  if (THEME.easing === "snap") { const q = clamp01(p * 1.15); return 1 - Math.pow(1 - q, 4); }
  if (THEME.easing === "soft") return p * p * (3 - 2 * p);
  return easeOut(p);
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------------- item builders (DOM exists for the whole timeline) ------- */
function el(cls, parent) { const d = document.createElement("div"); d.className = cls; parent.appendChild(d); return d; }

const layoutJobs = [];
function buildPoster(item) {
  const root = el("item poster", stage);
  const zone = item.zone || [0.615, 0.845];
  const wrap = el("stackwrap", root);
  wrap.style.cssText = `position:absolute;left:0;right:0;top:${(((zone[0] + zone[1]) / 2) * H).toFixed(0)}px;transform:translateY(-50%);display:flex;justify-content:center;`;
  const stack = el("stack", wrap);
  const words = [];
  (item.rows || []).forEach(row => {
    const r = el("row", stack);
    row.forEach(wd => {
      const s = document.createElement("span");
      const kind = wd.kind || "conn";
      s.className = "w " + (kind === "key" ? "key" : kind === "serif" ? "serif" : kind === "neon" ? "neon" : "conn");
      s.textContent = wd.w;
      s.style.fontSize = (kind === "key" || kind === "neon" ? (item.keySize || 118) : (item.connSize || 58)) + "px";
      if (kind === "key") {
        // keyword = ink on an accent PLATE (the format's highlight
        // word): the pair is 4.5:1+ by construction on any footage,
        // where accent-coloured glyphs on a bright wall cannot be
        const ac = item.accent || ACCENT;
        s.style.background = ac;
        s.style.color = "#0D0F12";
        s.style.webkitTextStroke = "0px";
        s.style.padding = "0px 20px";
        s.style.borderRadius = "16px";
        s.dataset.glowc = ac;
      }
      if (kind === "neon") s.style.color = wd.color || "#FF3355";
      if (wd.glow) s.dataset.glow = "1";
      r.appendChild(s);
      const sp = document.createElement("span");
      sp.style.display = "inline-block"; sp.style.width = (kind === "key" ? 26 : 16) + "px";
      r.appendChild(sp);
      words.push({ el: s, at: wd.at, kind });
    });
  });
  layoutJobs.push(() => autofit(stack, 0.88));
  return { item, root, words, stack };
}

function buildChip(item) {
  const root = el("item chip", stage);
  const zone = item.zone || [0.615, 0.845];
  root.style.justifyContent = "flex-start";
  root.style.flexDirection = "column";
  root.style.alignItems = "center";
  const bar = el("bar", root);
  bar.style.background = item.accent || ACCENT;
  // fixed 67%-of-frame bar (spec 65-70% wide, 6-7% high), icon left,
  // single text line: a second line would push the bar past 7% high
  // OR the text under the 3% floor - the schema rejects `sub` on chips
  bar.style.width = Math.round(0.67 * W) + "px";
  const ic = el("ic", bar);
  ic.innerHTML = item.iconSvg || "";
  const tx = el("tx", bar);
  const t1 = el("t1", tx); t1.textContent = item.title || "";
  t1.style.fontSize = (item.titleSize || 64) + "px";
  const streak = el("streak", bar);
  root.style.paddingTop = Math.round(((zone[0] + zone[1]) / 2) * H - 62) + "px";
  layoutJobs.push(() => {
    let fs = item.titleSize || 64;
    while (t1.scrollWidth > 560 && fs > 58) { fs -= 2; t1.style.fontSize = fs + "px"; }
  });
  return { item, root, bar, streak };
}

function buildCard(item) {
  const root = el("item card", stage);
  root.style.background = item.bg === "accent" ? (item.accent || ACCENT)
    : item.bg === "white" ? "#ffffff" : (item.bgColor || "#0c1015");
  const words = [];
  const lineEls = [];
  (item.lines || []).forEach(line => {
    const ln = el("cline", root);
    lineEls.push(ln);
    line.forEach(wd => {
      const s = document.createElement("span");
      s.className = "cw" + (wd.kind === "serif" ? " serif" : "") + (wd.kind === "neon" ? " neon" : "");
      s.textContent = wd.w;
      s.style.fontSize = (wd.size || item.wordSize || 120) + "px";
      if (wd.kind === "key" && item.bg !== "accent") {
        const ac = item.accent || ACCENT;
        s.style.background = ac;
        s.style.color = "#0D0F12";
        s.style.webkitTextStroke = "0px";
        s.style.padding = "0px 20px";
        s.style.borderRadius = "16px";
        s.dataset.glowc = ac;
      }
      if (wd.kind === "neon") s.style.color = wd.color || "#FF3355";
      if (item.bg === "accent" && wd.kind === "key") s.style.color = "#ffffff";
      ln.appendChild(s);
      const sp = document.createElement("span");
      sp.style.display = "inline-block"; sp.style.width = "30px";
      ln.appendChild(sp);
      words.push({ el: s, at: wd.at, kind: wd.kind || "word" });
    });
  });
  layoutJobs.push(() => {
    // card lines must never bleed off the frame: one uniform scale
    // for all lines (type hierarchy survives), floored so the
    // smallest word stays readable; _fitScale is unused here (the
    // drift lives on the card root), the scale is baked per line
    let sc = 1;
    for (const ln of lineEls) sc = Math.min(sc, (0.88 * W) / Math.max(1, ln.scrollWidth));
    sc = Math.max(sc, 0.52);
    for (const ln of lineEls) {
      ln.style.transform = `scale(${sc.toFixed(3)})`;
      ln.style.transformOrigin = "50% 50%";
    }
  });
  return { item, root, words };
}

function buildFx(item) {
  const root = el("item fxlayer", stage);
  let node = null;
  if (item.kind === "flash") {
    node = el("fx-flash", root);
    const c = item.color || item.accent || ACCENT;
    node.style.background = `radial-gradient(ellipse at 50% 42%, ${hexA(c, .85)} 0%, ${hexA(c, .25)} 45%, transparent 72%)`;
  } else if (item.kind === "flare") {
    node = el("fx-flare", root);
    const c = item.color || item.accent || ACCENT;
    node.style.background =
      `linear-gradient(115deg, transparent 30%, ${hexA("#ffffff", .75)} 46%, ` +
      `${hexA(c, .8)} 58%, transparent 78%)`;
  } else if (item.kind === "leak") {
    node = el("fx-leak", root);
    const c = item.color || item.accent || ACCENT;
    node.style.background = `linear-gradient(90deg, transparent, ${hexA(c, .5)}, transparent)`;
  }
  return { item, root, node };
}

function zoneCentre(item, def) {
  const zone = item.zone || def || [0.615, 0.845];
  return { zone, cy: ((zone[0] + zone[1]) / 2) * H };
}

function mediaSrc(item) {
  return item.src && item.src.startsWith("/") ? "file://" + item.src : item.src;
}

function illTag(parent, item, size) {
  if (!item.illustrative) return null;
  const tag = el("tagill", parent);
  tag.textContent = "ILLUSTRATIVE";
  tag.style.background = item.accent || ACCENT;
  tag.style.color = "#0d0f12";
  tag.style.fontSize = (size || 58) + "px";
  return tag;
}

function buildPip(item) {
  const root = el("item pip", stage);
  const { cy } = zoneCentre(item);
  const cardW = Math.round((item.w || 0.58) * W);
  const imgH = Math.round(cardW * 0.66);
  root.style.paddingTop = Math.max(0, Math.round(cy - (imgH + 28) / 2)) + "px";
  const card = el("pcard", root);
  card.style.width = cardW + "px";
  const pimg = el("pimg", card);
  pimg.style.height = imgH + "px";
  const img = document.createElement("img");
  img.src = mediaSrc(item);
  pimg.appendChild(img);
  illTag(card, item);
  if (item.label) {
    const lab = el("plab", pimg);
    const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
    if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "58px"; }
  }
  return { item, root, pipCard: card, pipImg: img };
}

function buildBroll(item) {
  const root = el("item broll", stage);
  const win = el("win", root);
  let full = false;
  if ((item.mode || "fullbleed") === "fullbleed") {
    // preferred form: replaces the speaker full-frame for 1.0-1.8 s,
    // the running caption stack stays over it (authored as a poster)
    full = true;
    win.style.left = "0px"; win.style.top = "0px";
    win.style.width = W + "px"; win.style.height = H + "px";
    win.style.borderRadius = "0px";
    win.style.boxShadow = "none";
  } else {
    // alternate card: 60-70% wide, centred (never a corner, never <55%)
    const winW = Math.round((item.w || 0.65) * W);
    const zone = item.zone || [0.30, 0.80];
    const winH = Math.round((zone[1] - zone[0]) * H);
    win.style.left = ((W - winW) / 2) + "px";
    win.style.top = (zone[0] * H) + "px";
    win.style.width = winW + "px";
    win.style.height = winH + "px";
    win.style.border = `4px solid ${hexA(item.accent || ACCENT, .9)}`;
    win.style.boxShadow = `0 30px 80px rgba(0,0,0,.55), 0 0 44px ${hexA(item.accent || ACCENT, .35)}`;
  }
  const img = document.createElement("img");
  img.src = mediaSrc(item);
  win.appendChild(img);
  el("scrim", win);
  if (item.label) {
    const lab = el("blab", win);
    const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
    if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "58px"; }
  }
  illTag(win, item);
  return { item, root, win, bimg: img, bfull: full };
}

/* ---- animated vector scenes (Fiverr-style: drawn, not photographed).
   Deterministic SVG: every property derives from the frame clock. */
const VEC_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  const n = document.createElementNS(VEC_NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function buildVector(item) {
  const ac = item.accent || ACCENT;
  const full = (item.mode || "card") === "fullbleed";
  const V = { name: item.name || "burst", n: {} };
  let svg;
  if (full) {
    const root = el("item broll", stage);
    const win = el("win", root);
    win.style.left = "0px"; win.style.top = "0px";
    win.style.width = W + "px"; win.style.height = H + "px";
    win.style.borderRadius = "0px"; win.style.boxShadow = "none";
    win.style.background = "#101319";
    const wrap = el("pimg", win);
    wrap.style.cssText = "position:absolute;inset:0;";
    svg = svgEl("svg", { viewBox: "0 0 1080 1920", preserveAspectRatio: "xMidYMid slice" }, wrap);
    svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;";
    if (item.label) {
      const lab = el("blab", win);
      const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
      if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "58px"; }
    }
    buildScene(svg, V, ac, item, 1080, 1920);
    return { item, root, win, bimg: wrap, bfull: true, vec: V };
  }
  const root = el("item pip", stage);
  const { cy } = zoneCentre(item);
  const cardW = Math.round((item.w || 0.58) * W);
  const imgH = Math.round(cardW * 0.66);
  root.style.paddingTop = Math.max(0, Math.round(cy - (imgH + 28) / 2)) + "px";
  const card = el("pcard", root);
  card.style.width = cardW + "px";
  const pimg = el("pimg", card);
  pimg.style.height = imgH + "px";
  pimg.style.background = "#14181f";

    n.hub = svgEl("circle", { cx: cx * s, cy: cy * s, r: 34 * s, fill: ac }, svg);
    n.hubT = svgEl("text", { x: cx * s, y: (cy + 11) * s, "text-anchor": "middle", fill: "#0D0F12", "font-size": 32 * s, "font-weight": 800, "font-family": "MontserratX" }, svg);
    n.hubT.textContent = (item.title || "YOU").toUpperCase().slice(0, 6);
    fitSvg(n.hubT, 58 * s);
  } else if (V.name === "gauge") {
    // SHOW intensity: a semicircular gauge sweeps to the value
    svgEl("rect", { x: 0, y: 0, width: vw, height: vh, fill: "#14181f" }, svg);
    const cx = 300, cy = H / 2 + 70, r = 185;
    const arc = (rr) => `M ${(cx - rr) * s} ${cy * s} A ${rr * s} ${rr * s} 0 0 1 ${(cx + rr) * s} ${cy * s}`;
    svgEl("path", { d: arc(r), fill: "none", stroke: "#232d40", "stroke-width": 26 * s, "stroke-linecap": "round" }, svg);
    n.arcLen = Math.PI * r * s;
    n.arc = svgEl("path", { d: arc(r), fill: "none", stroke: ac, "stroke-width": 26 * s, "stroke-linecap": "round", "stroke-dasharray": n.arcLen }, svg);
    n.arc.style.strokeDashoffset = n.arcLen;
    n.needle = svgEl("line", { x1: cx * s, y1: cy * s, x2: cx * s, y2: (cy - (r - 34)) * s, stroke: "#FFFFFF", "stroke-width": 9 * s, "stroke-linecap": "round" }, svg);
    svgEl("circle", { cx: cx * s, cy: cy * s, r: 17 * s, fill: "#FFFFFF" }, svg);
    n.gnum = svgEl("text", { x: cx * s, y: (cy + 92) * s, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 84 * s, "font-weight": 800, "font-family": "MontserratX" }, svg);
    n.gval = Math.max(0, Math.min(100, item.value || 0));
    n.gcx = cx; n.gcy = cy;
  } else if (V.name === "map") {
    // SHOW a place: street grid, a pin drops, rings pulse out
    svgEl("rect", { x: 0, y: 0, width: vw, height: vh, fill: "#14181f" }, svg);
    const mx = 66, my = H / 2 - 235, mw = 468, mh = 470;
    svgEl("rect", { x: mx * s, y: my * s, width: mw * s, height: mh * s, rx: 22 * s, fill: "#10141c", stroke: "#2b3547", "stroke-width": 4 * s }, svg);
    const cl = svgEl("clipPath", { id: "mapc" + Math.round(item.at * 100) }, svg);
    svgEl("rect", { x: mx * s, y: my * s, width: mw * s, height: mh * s, rx: 22 * s }, cl);
    const gmap = svgEl("g", { "clip-path": `url(#mapc${Math.round(item.at * 100)})` }, svg);
    const streets = [[0, 120, 468, 60], [0, 300, 468, 380], [120, 0, 60, 470], [300, 0, 380, 470], [0, 430, 468, 210], [430, 0, 210, 470]];
    streets.forEach(([x1, y1, x2, y2]) => {
      svgEl("line", { x1: (mx + x1) * s, y1: (my + y1) * s, x2: (mx + x2) * s, y2: (my + y2) * s, stroke: "#232d40", "stroke-width": 13 * s }, gmap);
    });
    const pinX = mx + mw * (item.x ?? 0.52), pinY = my + mh * (item.y ?? 0.44);
    n.rings = [0, 1].map(() => svgEl("circle", { cx: pinX * s, cy: pinY * s, r: 10 * s, fill: "none", stroke: ac, "stroke-width": 5 * s, opacity: 0 }, svg));
    n.pin = svgEl("g", {}, svg);
    svgEl("path", { d: `M ${pinX * s} ${(pinY + 34) * s} C ${(pinX - 24) * s} ${(pinY - 6) * s}, ${(pinX - 20) * s} ${(pinY - 34) * s}, ${pinX * s} ${(pinY - 34) * s} C ${(pinX + 20) * s} ${(pinY - 34) * s}, ${(pinX + 24) * s} ${(pinY - 6) * s}, ${pinX * s} ${(pinY + 34) * s} Z`, fill: ac }, n.pin);
    svgEl("circle", { cx: pinX * s, cy: (pinY - 16) * s, r: 10 * s, fill: "#14181f" }, n.pin);
    const pt = svgEl("text", { x: pinX * s, y: (pinY + 78) * s, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 36 * s, "font-weight": 800, "font-family": "MontserratX" }, svg);
    pt.textContent = (item.place || "").toUpperCase();
    fitSvg(pt, 400 * s);
    n.pinY = pinY;
  } else {  // burst
    svgEl("rect", { x: 0, y: 0, width: vw, height: vh, fill: "#14181f" }, svg);
    const cy = H / 2;
    n.rays = svgEl("g", {}, svg);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      svgEl("line", { x1: (300 + Math.cos(a) * 62) * s, y1: (cy + Math.sin(a) * 62) * s, x2: (300 + Math.cos(a) * 122) * s, y2: (cy + Math.sin(a) * 122) * s, stroke: i % 2 ? ac : "#E8EDF4", "stroke-width": 10 * s, "stroke-linecap": "round" }, n.rays);
    }
    n.ring = svgEl("circle", { cx: 300 * s, cy: cy * s, r: 40 * s, fill: "none", stroke: ac, "stroke-width": 6 * s }, svg);
    n.dot = svgEl("circle", { cx: 300 * s, cy: cy * s, r: 26 * s, fill: ac }, svg);
    V.cy = cy;
  }
}

function animateVector(b, t, lifeP) {
  const V = b.vec, n = V.n, s = V.s, p = lifeP;
  const dur = Math.max(0.001, (b.item.until ?? b.item.at + 2) - b.item.at);
  const lt = t - b.item.at;
  if (V.name === "hoop") {
    const rimX = V.rimX, rimY = V.rimY, fl = V.floorY - 25;
    let bx, by;
    if (p < 0.45) {
      const q = easeOut(p / 0.45);
      bx = 150 + (rimX - 150) * q;
      by = fl + (rimY - 14 - fl) * q - Math.sin((p / 0.45) * Math.PI) * 96;
    } else if (p < 0.62) {
      const q = (p - 0.45) / 0.17;
      bx = rimX; by = rimY - 14 + (fl - rimY + 14) * q * q;
    } else {
      const q = (p - 0.62) / 0.38;
      bx = rimX + q * 96;
      by = fl - Math.abs(Math.sin(q * Math.PI * 2.2)) * 44 * (1 - q);
    }
    n.ball.setAttribute("transform", `translate(${(bx * s).toFixed(1)} ${(by * s).toFixed(1)}) rotate(${((lt * 190) % 360).toFixed(0)})`);
    const sw = p > 0.45 ? Math.sin((p - 0.45) * 26) * 7 * Math.max(0, 1 - (p - 0.45) * 2.4) : 0;
    n.net.setAttribute("transform", `rotate(${sw.toFixed(2)} ${rimX * s} ${198 * s})`);
    n.flash.setAttribute("opacity", (p > 0.45 && p < 0.7 ? (1 - (p - 0.45) / 0.25) * 0.9 : 0).toFixed(2));
    if (p > 0.45) n.flash.setAttribute("r", ((62 + (p - 0.45) * 170) * s).toFixed(1));
  } else if (V.name === "led") {
    n.strip.setAttribute("stroke-dashoffset", (-lt * 140 * s).toFixed(1));
    n.wash.setAttribute("opacity", (0.07 + 0.035 * Math.sin(lt * 2.4)).toFixed(3));
  } else if (V.name === "donut") {
    const q = clamp01(lt / Math.min(1.4, dur * 0.7));
    n.arc.setAttribute("stroke-dashoffset", (n.C * (1 - (n.value / 100) * easeOut(q))).toFixed(1));
    n.txt.textContent = Math.round(n.value * easeOut(q)) + "%";
  } else if (V.name === "arrow") {
    const q = clamp01(lt / Math.min(1.1, dur * 0.6));
    n.path.setAttribute("stroke-dashoffset", (n.len * (1 - easeOut(q))).toFixed(1));
    n.head.setAttribute("opacity", q > 0.85 ? ((q - 0.85) / 0.15).toFixed(2) : 0);
    n.head.setAttribute("transform", `translate(0 ${(Math.sin(lt * 3) * 5 * s).toFixed(1)})`);
  } else if (V.name === "bars") {
    n.bars.forEach((b, i) => {
      const q = easeOut(clamp01((lt - 0.12 - i * 0.13) / 0.6));
      // a zero value still draws a stub: no bar at all reads as broken
      const hh = b.v === 0 ? 7 * q : b.hMax * q;
      b.r.setAttribute("height", (hh * s).toFixed(1));
      b.r.setAttribute("y", ((n.base - hh) * s).toFixed(1));
      b.tv.textContent = fmt(Math.round(b.v * q));
      b.tv.setAttribute("y", ((n.base - hh - 14) * s).toFixed(1));
      b.tv.setAttribute("opacity", q > 0.06 ? 1 : 0);
      b.tl.setAttribute("opacity", clamp01((lt - 0.5 - i * 0.13) / 0.3).toFixed(2));
    });
  } else if (V.name === "line") {
    const q = easeInOut(clamp01(lt / Math.min(1.4, dur * 0.62)));
    n.path.style.strokeDashoffset = n.len * (1 - q);
    const cnt = n.dots.length;
    n.dots.forEach((d, i) => {
      const frac = cnt <= 1 ? 1 : i / (cnt - 1);
      const pq = easeOutBack(clamp01((q - frac) / 0.12));
      d.setAttribute("r", (11 * Math.max(0, pq) * s).toFixed(1));
    });
    // the end value arrives WITH the line tip, not ahead of it
    const eq = easeOut(clamp01((q - 0.78) / 0.22));
    n.end.textContent = fmt(Math.round(n.endVal * eq)) + (b.item.unit || "");
    n.end.setAttribute("opacity", clamp01((q - 0.8) / 0.15).toFixed(2));
  } else if (V.name === "versus") {
    const qL = easeOut(clamp01(lt / 0.45)), qR = easeOut(clamp01((lt - 0.12) / 0.45));
    n.vsL.g.style.transform = `translateX(${(-52 * (1 - qL) * s).toFixed(1)}px)`;
    n.vsL.g.style.opacity = qL.toFixed(2);
    n.vsR.g.style.transform = `translateX(${(52 * (1 - qR) * s).toFixed(1)}px)`;
    n.vsR.g.style.opacity = qR.toFixed(2);
    const qc = easeOut(clamp01((lt - 0.3) / 0.75));
    n.vsL.tv.textContent = fmt(Math.round(n.vsL.val * qc)) + (b.item.unit || "");
    n.vsR.tv.textContent = fmt(Math.round(n.vsR.val * qc)) + (b.item.unit || "");
    const qb = easeOutBack(clamp01((lt - 0.35) / 0.3));
    n.badge.style.transformOrigin = `${300 * s}px ${n.vsCy * s}px`;
    n.badge.style.transform = `scale(${Math.max(0.001, qb).toFixed(3)})`;
  } else if (V.name === "people") {
    const total = n.total, span = Math.min(1.6, dur * 0.6);
    let shown = 0;
    n.icons.forEach((ic, i) => {
      const q = easeOutBack(clamp01((lt - 0.12 - (span * i) / total) / 0.22));
      ic.g.style.transformOrigin = `${ic.cx * s}px ${ic.cy * s}px`;
      ic.g.style.transform = `scale(${Math.max(0.001, q).toFixed(3)})`;
      ic.g.style.opacity = clamp01(q * 1.6).toFixed(2);
      if (q > 0.5 && i < n.count) shown = i + 1;
    });
    n.num.textContent = fmt(shown);
  } else if (V.name === "stack") {
    n.segs.forEach((sg, i) => {
      const q = easeOut(clamp01((lt - 0.15 - i * 0.2) / 0.55));
      sg.r.style.transformOrigin = `${sg.x * s}px 0px`;
      sg.r.style.transform = `scaleX(${Math.max(0.001, q).toFixed(3)})`;
      sg.tv.textContent = fmt(Math.round(sg.p * q)) + "%";
      // a sliver segment (<26 units) cannot carry text: it still fills,
      // but its label/% stay hidden instead of floating over neighbours
      const o = sg.w < 26 ? 0 : clamp01((q - 0.5) / 0.35).toFixed(2);
      sg.tv.setAttribute("opacity", o);
      sg.tl.setAttribute("opacity", o);
    });
  } else if (V.name === "timeline") {
    const q = easeInOut(clamp01(lt / Math.min(1.3, dur * 0.6)));
    n.tline.style.strokeDashoffset = (500 * s * (1 - q)).toFixed(1);
    n.evs.forEach((e) => {
      // normalise per-event progress so the LAST event also completes:
      // un-normalised, a dot at x=0.94 would freeze mid-overshoot and its
      // label would cap at ~75% opacity
      const prog = e.x >= 1 ? 1 : clamp01((q - e.x) / (1 - e.x));
      const pq = easeOutBack(clamp01(prog / 0.35));
      e.dot.setAttribute("r", (12 * Math.max(0, pq) * s).toFixed(1));
      const o = clamp01(prog / 0.3).toFixed(2);
      e.tl.setAttribute("opacity", o); e.ts.setAttribute("opacity", o);
    });
  } else if (V.name === "quote") {
    n.qlines.forEach((tx, i) => {
      const q = easeOut(clamp01((lt - 0.25 - i * 0.16) / 0.4));
      tx.setAttribute("opacity", q.toFixed(2));
      tx.style.transform = `translateY(${((1 - q) * 16 * s).toFixed(1)}px)`;
    });
    if (n.qby) n.qby.setAttribute("opacity", clamp01((lt - 0.25 - (n.qlines.length) * 0.16) / 0.4).toFixed(2));
  } else if (V.name === "chat") {
    // cascade adapts to the window: a scene bound to a short spoken
    // phrase (~1.2s) must still land every bubble before it exits
    const st = Math.min(0.24, dur * 0.17), sp = Math.min(0.32, dur * 0.32);
    n.bubbles.forEach((g, i) => {
      const q = easeOutBack(clamp01((lt - 0.14 - i * st) / sp));
      g.style.opacity = clamp01(q * 1.7).toFixed(2);
      g.style.transform = `translateY(${((1 - clamp01(q)) * 20 * s).toFixed(1)}px)`;
    });
  } else if (V.name === "network") {
    n.links.forEach((ln, i) => {
      const q = easeOut(clamp01((lt - 0.15 - i * 0.09) / 0.4));
      const L = parseFloat(ln.getAttribute("stroke-dasharray"));
      ln.style.strokeDashoffset = (L * (1 - q)).toFixed(1);
      const pq = easeOutBack(clamp01((lt - 0.4 - i * 0.09) / 0.3));
      n.sats[i].setAttribute("r", ((i === 0 ? 19 : 15) * Math.max(0, pq) * s).toFixed(1));
    });
    const hp = 1 + Math.sin(lt * 2.6) * 0.05;
    n.hub.setAttribute("r", (34 * hp * s).toFixed(1));
  } else if (V.name === "gauge") {
    const q = easeInOut(clamp01(lt / Math.min(1.25, dur * 0.55)));
    n.arc.style.strokeDashoffset = (n.arcLen * (1 - q)).toFixed(1);
    const ang = -90 + 180 * q * (n.gval / 100);
    n.needle.setAttribute("transform", `rotate(${ang.toFixed(1)} ${n.gcx * s} ${n.gcy * s})`);
    n.gnum.textContent = fmt(Math.round(n.gval * q)) + "%";
  } else if (V.name === "map") {
    const q = easeOutBack(clamp01((lt - 0.1) / 0.45));
    n.pin.style.transform = `translateY(${((1 - clamp01(q)) * -130 * s).toFixed(1)}px)`;
    n.pin.style.opacity = clamp01(q * 2).toFixed(2);
    n.rings.forEach((r, i) => {
      const rq = ((lt - 0.5 - i * 0.45) % 1.3 + 1.3) % 1.3 / 1.3;
      r.setAttribute("r", ((12 + rq * 62) * s).toFixed(1));
      r.setAttribute("opacity", (0.75 * (1 - rq) * clamp01((lt - 0.4) * 3)).toFixed(2));
    });
  } else {
    n.rays.setAttribute("transform", `rotate(${((lt * 14) % 360).toFixed(1)} ${300 * s} ${V.cy * s})`);
    const rq = (lt % 1.6) / 1.6;
    n.ring.setAttribute("r", ((40 + rq * 130) * s).toFixed(1));
    n.ring.setAttribute("opacity", (0.85 * (1 - rq)).toFixed(2));
    n.dot.setAttribute("r", ((26 + Math.sin(lt * 4) * 3) * s).toFixed(1));
  }
}

function buildCounter(item) {
  const root = el("item counter", stage);
  const { cy } = zoneCentre(item);
  const wrap = el("cwrap", root);
  wrap.style.top = Math.round(cy - 135) + "px";
  const num = el("num", wrap);
  num.style.color = item.accent || ACCENT;
  num.style.fontSize = "200px";
  if (item.prefix) { const s = document.createElement("span"); s.className = "affix"; s.textContent = item.prefix; num.appendChild(s); }
  const val = document.createElement("span");
  val.textContent = "0";
  num.appendChild(val);
  if (item.suffix) { const s = document.createElement("span"); s.className = "affix"; s.textContent = item.suffix; num.appendChild(s); }
  if (item.label) { const lab = el("clab", wrap); lab.textContent = item.label; }
  layoutJobs.push(() => {
    let fs = 200;
    while (num.scrollWidth > 950 && fs > 90) { fs -= 10; num.style.fontSize = fs + "px"; }
  });
  return { item, root, num, numVal: val, cwrap: wrap };
}

function buildList(item) {
  const root = el("item listp", stage);
  const zone = item.zone || [0.50, 0.95];
  const wrap = el("lwrap", root);
  wrap.style.top = (zone[0] * H) + "px";
  let head = null;
  if (item.title) {
    head = el("lhead", wrap);
    head.textContent = item.title;
    head.style.background = item.accent || ACCENT;
    head.style.fontSize = "58px";
  }
  const plates = (item.items || []).map((pl, i) => {
    const pel = el("plate", wrap);
    const badge = el("badge", pel);
    badge.textContent = String(i + 1);
    badge.style.fontSize = "58px";
    const tx = el("ptx", pel);
    const t1 = el("pt1", tx); t1.textContent = pl.text; t1.style.fontSize = "64px";
    let t2 = null;
    if (pl.sub) { t2 = el("pt2", tx); t2.textContent = pl.sub; t2.style.fontSize = "58px"; }
    layoutJobs.push(() => {
      // shrink floor is the 3% rule (58px): plates grow, type doesn't sink
      let fs = 64;
      while (t1.scrollWidth > 700 && fs > 58) { fs -= 2; t1.style.fontSize = fs + "px"; }
    });
    return { el: pel, badge, at: pl.at };
  });
  return { item, root, plates, lhead: head, lwrap: wrap };
}

function buildProcess(item) {
  const root = el("item proc", stage);
  const { cy } = zoneCentre(item, [0.52, 0.92]);
  const wrap = el("pwrap", root);
  wrap.style.top = Math.round(cy) + "px";
  wrap.style.transform = "translateY(-50%)";
  if (item.title) {
    const t = el("ptitle", wrap);
    t.textContent = item.title;
    t.style.background = item.accent || ACCENT;
    t.style.fontSize = "58px";
  }
  const steps = (item.steps || []).map((st, i, arr) => {
    const row = el("srow", wrap);
    const col = el("scol", row);
    const circ = el("scirc", col);
    circ.textContent = String(i + 1);
    circ.style.fontSize = "58px";
    let line = null;
    if (i < arr.length - 1) line = el("sline", col);
    const tx = el("stx", row);
    const t1 = el("st1", tx); t1.textContent = st.text; t1.style.fontSize = "64px";
    if (st.sub) { const t2 = el("st2", tx); t2.textContent = st.sub; t2.style.fontSize = "58px"; }
    layoutJobs.push(() => {
      let fs = 64;
      while (t1.scrollWidth > 700 && fs > 58) { fs -= 2; t1.style.fontSize = fs + "px"; }
    });
    return { row, circ, line, at: st.at };
  });
  return { item, root, steps, pwrap: wrap };
}

function lifeFx(t, at, until, enterFrames) {
  // opacity resolves within 2 frames either side (semi-transparent QC);
  // the exit is the 8-frame slide+blur profile, opacity last 2 frames
  const opIn = clamp01((t - at) / (2 / FPS));
  const x = exitFade(until, t);
  return { op: Math.min(opIn, x.op), blur: x.blur, slide: x.slide,
           pIn: clamp01((t - at) / ((enterFrames || 10) / FPS)) };
}

function fmtVal(v, dec) {
  const parts = v.toFixed(dec).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.join(".");
}

function fitSvg(tx, maxW) {
  // SVG text cannot wrap: shrink its font-size (measured once fonts are
  // in, via layoutJobs) until it fits maxW px. Floor 40% of authored size.
  layoutJobs.push(() => {
    let fs = parseFloat(tx.getAttribute("font-size"));
    const floor = fs * 0.4;
    for (let i = 0; i < 24; i++) {
      if (tx.getComputedTextLength() <= maxW || fs <= floor) break;
      fs *= 0.94;
      tx.setAttribute("font-size", fs.toFixed(1));
    }
  });
}

function autofit(node, maxFrac, singleLine) {
  // shrink until the content fits the frame width (never touch the
  // edges); the shrink is capped so effective type never falls under
  // the 3% floor - a stack still overflowing at the cap is a QC
  // finding (author shorter words), never a silent shrink
  const maxW = maxFrac * W;
  let scale = 1;
  for (let i = 0; i < 24; i++) {
    const w = node.scrollWidth;
    if (w <= maxW || scale <= 0.62) break;
    scale *= 0.94;
    node.style.transform = `scale(${scale})`;
    node.style.transformOrigin = "50% 0";
    if (singleLine) node.style.transformOrigin = "50% 50%";
  }
  node._fitScale = scale;
}

/* ---------------- per-frame application --------------------------------- */
function wordEnter(wd, t) {
  // style for a word at time t (seconds); enters over 7f starting
  // WORD_LEAD (2 frames) before the authored speech onset
  const dt = t - (wd.at - WORD_LEAD);
  const enterF = 7 / FPS, p = clamp01(dt / enterF);
  const blur = 6 * (1 - easeOut(p));
  const y = 34 * (1 - easeOut(p));
  const rot = 1.6 * (1 - easeOut(p));
  const op = clamp01(dt / (2 / FPS));
  let scale = 1;
  if (wd.kind === "key" || wd.kind === "neon") {
    const pk = clamp01(dt / ((10 / THEME.speed) / FPS));
    scale = pk < 0.62 ? 0.85 + (1.08 - 0.85) * themeEase(pk / 0.62)
                     : 1.08 - 0.08 * themeEase((pk - 0.62) / 0.38);
  }
  return { blur, y, rot, op, scale };
}

function exitFade(endT, t) {
  // spec exit: 8 frames - 12 px slide + blur across all 8, opacity only
  // in the last 2 (a graphic is never semi-transparent >2 frames);
  // endT is the exit START; the element is fully gone at endT + 8f
  const dt = t - endT;
  const p = clamp01(dt / (8 / FPS));
  const op = dt <= 6 / FPS ? 1 : clamp01(1 - (dt - 6 / FPS) / (2 / FPS));
  return { blur: 6 * easeIn(p), slide: 12 * easeIn(p), op };
}

const WORD_LEAD = 2 / FPS;   // words appear 2 frames BEFORE the onset
function applyWord(wd, t, until) {
  const e = wordEnter(wd, t);
  // a word always completes its entry first: its exit cannot start
  // until its (lead-shifted) pop has finished (blur cross-swap)
  const x = exitFade(Math.max(until, wd.at + 8 / FPS), t);
  const elx = wd.el;
  const glow = wd.el.dataset.glow === "1" || wd.kind === "key";
  let shadow = "0 6px 22px rgba(0,0,0,.45)";
  if (wd.kind === "key") {
    const dt = t - (wd.at - WORD_LEAD);
    const pulse = dt < 12 / FPS ? (0.55 + 0.45 * Math.sin((dt / (12 / FPS)) * Math.PI)) : 0.5;
    const c = wd.el.dataset.glowc || wd.el.style.color;
    shadow = `0 0 ${26 * pulse + 10}px ${c}, 0 6px 22px rgba(0,0,0,.4)`;
  }
  if (wd.kind === "neon") {
    // electric glow with a 4-frame flicker at entry (glow only - the
    // word's opacity curve stays clean for the semi-transparent QC)
    const f = Math.round((t - (wd.at - WORD_LEAD)) * FPS);
    const flick = f >= 3 && f <= 6 ? [0.45, 1, 0.6, 1][f - 3] : 1;
    const c = wd.el.style.color;
    shadow = `0 0 ${Math.round(17 * flick)}px ${c}, 0 0 ${Math.round(46 * flick)}px ${c}, 0 6px 22px rgba(0,0,0,.45)`;
  }
  elx.style.opacity = Math.min(e.op, x.op).toFixed(3);
  elx.style.filter = `blur(${Math.max(e.blur, x.blur).toFixed(2)}px)`;
  elx.style.transform = `translateY(${(e.y + x.slide).toFixed(1)}px) rotate(${e.rot.toFixed(2)}deg) scale(${e.scale.toFixed(3)})`;
  elx.style.textShadow = shadow;
  trackSemi(elx, Math.min(e.op, x.op));
}

const stage = document.getElementById("stage");
function trackSemi(elx, op) {
  // per-element accounting: a single word may not linger semi-transparent
  // for more than 2 consecutive frames (spec QC); different words
  // crossfading through each other is the designed transition
  const semi = op > 0.04 && op < 0.96;
  elx._semiRun = semi ? (elx._semiRun || 0) + 1 : 0;
  elx._semiMax = Math.max(elx._semiMax || 0, elx._semiRun);
  if (stats && semi) stats.semiFrames++;
  if (stats) stats.semiMaxRun = Math.max(stats.semiMaxRun || 0, elx._semiMax);
}

function renderAt(tMs) {
  const t = tMs / 1000;
  stats = { semiFrames: 0, semiMaxRun: 0 };
  for (const b of builtItems) {
    const it = b.item;
    const active = t >= it.at - 0.001 - (b.words ? WORD_LEAD : 0) &&
                   t < (it.until ?? it.at + 2) + 10 / FPS;
    b.root.style.display = active ? "" : "none";
    if (!active) continue;
    if (b.words) b.words.forEach(wd => applyWord(wd, t, it.until ?? it.at + 2));
    const dwell = Math.max(0.001, (it.until ?? it.at + 2) - it.at);
    const lifeP = clamp01((t - it.at) / dwell);
    // idle motion (spec: nothing fully static beyond 0.8 s): text
    // stacks breathe 100 -> 103% across their whole lifetime
    if (b.stack) {
      const drift = 1 + 0.03 * lifeP;
      b.stack.style.transform = `scale(${((b.stack._fitScale || 1) * drift).toFixed(4)})`;
      b.stack.style.transformOrigin = "50% 50%";
    }
    if (b.bar) {
      const dt = t - it.at, until = it.until ?? it.at + 2;
      const wipe = clamp01(dt / (8 / FPS));          // mask wipe 8f
      const L = lifeFx(t, it.at, until, 8);
      b.bar.style.clipPath = `inset(-30% ${(1 - easeOut(wipe)) * 100}% -30% 0 round 999px)`;
      b.bar.style.filter = `blur(${(L.blur * 1.3).toFixed(2)}px)`;
      b.bar.style.opacity = L.op.toFixed(3);
      b.bar.style.transform = `translateY(${L.slide.toFixed(1)}px) scale(${(1 + 0.02 * lifeP).toFixed(4)})`;
      // entry streak rides the wipe; afterwards a shine sweep ~1.2 s
      let sweep = wipe, shine = wipe > 0 && wipe < 1;
      if (wipe >= 1) { const c = ((t - it.at) / 1.2) % 1; sweep = c; shine = c < 0.45; }
      b.streak.style.left = `${-30 + sweep * 150}%`;
      b.streak.style.opacity = shine ? 0.9 : 0;
      trackSemi(b.bar, L.op);
    }
    if (b.node) {
      const dt = t - it.at, dur = it.dur || 0.45;
      const p = clamp01(dt / dur);
      let op = 0, scale = 1;
      if (it.kind === "flash") op = p < 0.3 ? easeOut(p / 0.3) : 1 - easeIn((p - 0.3) / 0.7);
      else if (it.kind === "flare") { op = Math.sin(p * Math.PI); }   // leak peak sits on the cut
      else if (it.kind === "leak") { op = Math.sin(p * Math.PI) * 0.85; b.node.style.left = `${-20 + p * 120}%`; }
      b.node.style.opacity = (op * (it.strength || 1)).toFixed(3);
      if (it.kind === "flare") b.node.style.transform =
        `translate(${(-2 + p * 4).toFixed(2)}%, ${(-1 + p * 2).toFixed(2)}%) scale(1.06)`;
    }
    if (b.item.type === "card") {
      const until = it.until ?? it.at + 2;
      const inP = clamp01((t - it.at) / (2 / FPS));   // bg snaps in 2f (no ghosting)
      const L = lifeFx(t, it.at, until, 8);
      b.root.style.opacity = Math.min(inP, L.op).toFixed(3);
      b.root.style.transform = `scale(${(1 + 0.03 * lifeP).toFixed(4)})`;
    }
    if (b.pipCard) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      b.pipCard.style.opacity = L.op.toFixed(3);
      b.pipCard.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      b.pipCard.style.transform = `translateY(${((1 - easeOut(L.pIn)) * 46 + L.slide).toFixed(1)}px) ` +
        `rotate(${(-1.4 * (1 - easeOut(L.pIn))).toFixed(2)}deg) ` +
        `scale(${((0.88 + 0.12 * easeOut(L.pIn)) * (1 + 0.02 * lifeP)).toFixed(3)})`;
      b.pipImg.style.transform = `scale(${(1.0 + 0.08 * lifeP).toFixed(3)})`;  // 100->108 push-in
      trackSemi(b.pipCard, L.op);
    }
    if (b.win) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      if (b.bfull) {
        if (b.vec) {
          // Vector vehicles: clean 2f dissolve in/out, nothing else. The
          // shared exit profile (6px blur + 12px slide while opacity holds,
          // then a 2f plunge) smears a full-screen SVG into a ghost flash
          // on exit - viewers read it as the scene "glitching back" for a
          // microsecond. NO fractional scales either: a scaled SVG layer
          // makes headless Chromium mis-sample raster tiles (ghost copies
          // of the scene stamped into wrong tiles, seen on `network`).
          // The scene animates internally; it needs no photo push-in.
          b.win.style.opacity = L.op.toFixed(3);
          b.win.style.filter = "none";
          b.win.style.transform = "none";
          b.bimg.style.transform = "none";
        } else {
          b.win.style.opacity = L.op.toFixed(3);
          b.win.style.filter = `blur(${(L.blur).toFixed(2)}px)`;
          b.win.style.transform = `translateY(${L.slide.toFixed(1)}px) scale(${(1 + 0.015 * lifeP).toFixed(4)})`;
          b.bimg.style.transform = `scale(${(1.0 + 0.08 * lifeP).toFixed(3)})`;  // 100->108 push-in
        }
      } else {
        const p = easeOut(L.pIn);
        b.win.style.clipPath = `inset(${((1 - p) * 44).toFixed(2)}% ${((1 - p) * 10).toFixed(2)}% ` +
          `${((1 - p) * 44).toFixed(2)}% ${((1 - p) * 10).toFixed(2)}% round 40px)`;
        b.win.style.opacity = L.op.toFixed(3);
        b.win.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
        b.win.style.transform = `translateY(${L.slide.toFixed(1)}px)`;
        b.bimg.style.transform = `scale(${(1.0 + 0.08 * lifeP).toFixed(3)}) translateX(${(-1.6 + 3.2 * lifeP).toFixed(2)}%)`;
      }
      trackSemi(b.win, L.op);
    }
    if (b.vec) animateVector(b, t, lifeP);
    if (b.num) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 6);
      const cd = it.countDur || 0.9;
      const p = clamp01((t - it.at) / cd);
      b.numVal.textContent = fmtVal((it.value || 0) * easeOut(p), it.decimals || 0);
      let sc = 0.92 + 0.08 * easeOut(clamp01((t - it.at) / (6 / FPS)));
      if (p >= 1) {   // landing pulse 100 -> 106 -> 100 over 6 frames
        const q = clamp01((t - it.at - cd) / (6 / FPS));
        sc *= 1 + 0.06 * Math.sin(q * Math.PI);
        // then a slow glow pulse keeps the landed number alive
        const gp = 0.5 + 0.5 * Math.sin(((t - it.at - cd) / 1.2) * Math.PI * 2);
        b.num.style.textShadow = `0 0 ${(18 + 22 * gp).toFixed(0)}px ${hexA(it.accent || ACCENT, .55)}, ` +
          `0 10px 34px rgba(0,0,0,.45)`;
      }
      b.num.style.opacity = L.op.toFixed(3);
      b.num.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      b.num.style.transform = `scale(${sc.toFixed(3)})`;
      if (b.cwrap) {   // the label exits with the number (slide + same profile)
        b.cwrap.style.opacity = L.op.toFixed(3);
        b.cwrap.style.transform = `translateY(${L.slide.toFixed(1)}px)`;
      }
      trackSemi(b.num, L.op);
    }
    if (b.plates) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until, t);
      b.root.style.opacity = x.op.toFixed(3);
      b.root.style.filter = `blur(${(x.blur * 1.2).toFixed(2)}px)`;
      b.root.style.transform = `translateY(${x.slide.toFixed(1)}px)`;
      if (b.lwrap) b.lwrap.style.transform = `scale(${(1 + 0.02 * lifeP).toFixed(4)})`;
      if (b.lhead) b.lhead.style.opacity = clamp01((t - it.at) / (2 / FPS)).toFixed(3);
      let lastStarted = -1;
      b.plates.forEach((pl, i) => { if (t >= pl.at) lastStarted = i; });
      b.plates.forEach((pl, i) => {
        const dt = t - pl.at;
        const p = easeOut(clamp01(dt / (7 / FPS)));
        const op = clamp01(dt / (2 / FPS));
        pl.el.style.opacity = op.toFixed(3);
        pl.el.style.transform = `translateX(${(-70 * (1 - p)).toFixed(1)}px)`;
        pl.el.style.filter = `blur(${(5 * (1 - p)).toFixed(2)}px)`;
        const active = i === lastStarted;
        pl.badge.style.background = active ? (it.accent || ACCENT) : "rgba(255,255,255,.16)";
        pl.badge.style.color = active ? "#0d0f12" : "#ffffff";
        trackSemi(pl.el, op);
      });
    }
    if (b.steps) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until, t);
      b.root.style.opacity = x.op.toFixed(3);
      b.root.style.filter = `blur(${(x.blur * 1.2).toFixed(2)}px)`;
      b.root.style.transform = `translateY(${x.slide.toFixed(1)}px)`;
      if (b.pwrap) b.pwrap.style.transform =
        `translateY(-50%) scale(${(1 + 0.02 * lifeP).toFixed(4)})`;
      let lastStarted = -1;
      b.steps.forEach((s, i) => { if (t >= s.at) lastStarted = i; });
      b.steps.forEach((s, i) => {
        const dt = t - s.at;
        const p = easeOut(clamp01(dt / (7 / FPS)));
        const op = clamp01(dt / (2 / FPS));
        s.row.style.opacity = op.toFixed(3);
        s.row.style.transform = `translateY(${(26 * (1 - p)).toFixed(1)}px)`;
        if (i < lastStarted) {
          s.circ.textContent = "✓";
          s.circ.style.background = "rgba(255,255,255,.14)";
          s.circ.style.color = "#ffffff";
          s.circ.style.border = `3px solid ${hexA(it.accent || ACCENT, .85)}`;
          s.circ.style.boxShadow = "none";
        } else if (i === lastStarted) {
          s.circ.textContent = String(i + 1);
          s.circ.style.background = it.accent || ACCENT;
          s.circ.style.color = "#0d0f12";
          s.circ.style.border = "3px solid transparent";
          s.circ.style.boxShadow = `0 0 30px ${hexA(it.accent || ACCENT, .55)}`;
        } else {
          s.circ.textContent = String(i + 1);
          s.circ.style.background = "transparent";
          s.circ.style.color = "rgba(255,255,255,.55)";
          s.circ.style.border = "3px solid rgba(255,255,255,.3)";
          s.circ.style.boxShadow = "none";
        }
        if (s.line) s.line.style.background = i < lastStarted ? (it.accent || ACCENT) : "rgba(255,255,255,.18)";
        trackSemi(s.row, op);
      });
    }
  }
  return stats;
}

window.setTimeline = function (tl) {
  TL = tl;
  ACCENT = (tl.brand && tl.brand.accent) || ACCENT;
  if (tl.theme) THEME = Object.assign({}, THEME, tl.theme);
  const rad = { sharp: "6px", round: "26px", pill: "999px" }[THEME.radius] || "26px";
  let st = document.getElementById("themeStyle");
  if (!st) { st = document.createElement("style"); st.id = "themeStyle"; document.head.appendChild(st); }
  st.textContent =
    `.chip .bar, .listp .plate, .proc .srow, .card, .pip .pcard { border-radius: ${rad} !important; }` +
    (THEME.fontMode === "serif"
      ? `.poster .w, .card .cw { font-family: "SerifX"; font-style: italic; }` : "");
  stage.innerHTML = "";
  builtItems = [];
  layoutJobs.length = 0;
  const builders = { poster: buildPoster, chip: buildChip, card: buildCard, fx: buildFx,
                     pip: buildPip, broll: buildBroll, counter: buildCounter,
                     list: buildList, process: buildProcess, vector: buildVector };
  for (const item of tl.items || []) {
    if (item.type === "fx" && item.until == null) item.until = item.at + (item.dur || 0.45);
    const b = builders[item.type];
    if (b) builtItems.push(b(item));
  }
  return builtItems.length;
};
window.renderAt = renderAt;
window.layoutStage = function () {
  // run once fonts are in: autofit must measure with real metrics
  for (const job of layoutJobs) job();
  return layoutJobs.length;
};
</script>
</body>
</html>
