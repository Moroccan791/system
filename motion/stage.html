<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "MontserratX"; src: url("file:///home/user/system/assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
  @font-face { font-family: "MontserratX"; src: url("file:///home/user/system/assets/fonts/Montserrat-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "SerifX"; src: url("file:///home/user/system/assets/fonts/DejaVuSerif-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "SerifX"; src: url("file:///home/user/system/assets/fonts/DejaVuSerif.ttf"); font-weight: 400; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #stage { position: absolute; inset: 0; }
  .item { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

  /* ---- poster captions ---- */
  .poster { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .poster .stack { display: flex; flex-direction: column; align-items: center; }
  .poster .row { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; }
  .poster .w { display: inline-block; color: #fff; font-family: "MontserratX"; font-weight: 600;
               -webkit-text-stroke: 2px rgba(0,0,0,.55); paint-order: stroke fill;
               text-shadow: 0 6px 22px rgba(0,0,0,.45); will-change: transform, filter, opacity; }
  .poster .w.conn { font-weight: 600; letter-spacing: .02em; }
  .poster .w.serif { font-family: "SerifX"; font-style: italic; font-weight: 400; -webkit-text-stroke: 1.5px rgba(0,0,0,.5); }
  .poster .w.key { font-weight: 800; letter-spacing: .015em; transform-origin: 50% 60%; }

  /* ---- label chip ---- */
  .chip { display: flex; align-items: center; justify-content: center; }
  .chip .bar { position: relative; display: flex; align-items: center; gap: 22px;
               border-radius: 999px; padding: 26px 44px 26px 30px; overflow: hidden;
               box-shadow: 0 18px 50px rgba(0,0,0,.45); will-change: clip-path, filter, opacity; }
  .chip .ic { flex: 0 0 auto; width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; }
  .chip .ic svg { width: 62px; height: 62px; }
  .chip .tx { display: flex; flex-direction: column; }
  .chip .t1 { font-family: "MontserratX"; font-weight: 800; color: #0d0f12; letter-spacing: .01em; line-height: 1.04; white-space: nowrap; }
  .chip .t2 { font-family: "MontserratX"; font-weight: 600; color: rgba(13,15,18,.72); line-height: 1.1; white-space: nowrap; }
  .chip .streak { position: absolute; top: -20%; bottom: -20%; width: 120px; transform: skewX(-18deg);
                  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }

  /* ---- full-screen text card ---- */
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card .cw { display: inline-block; font-family: "MontserratX"; font-weight: 800; color: #fff;
              letter-spacing: .01em; will-change: transform, filter, opacity; }
  .card .cw.serif { font-family: "SerifX"; font-style: italic; font-weight: 700; }
  .card .cline { display: flex; justify-content: center; align-items: baseline; white-space: nowrap; }

  .poster .w.neon, .card .cw.neon { font-weight: 800; letter-spacing: .015em; }

  /* ---- PiP / proof card ---- */
  .pip { display: flex; align-items: flex-start; justify-content: center; }
  .pip .pcard { position: relative; background: #fff; border-radius: 34px; padding: 14px;
                box-shadow: 0 26px 64px rgba(0,0,0,.5); will-change: transform, filter, opacity; }
  .pip .pimg { border-radius: 22px; overflow: hidden; position: relative; }
  .pip .pimg img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .pip .plab { position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column;
               background: rgba(8,10,13,.85); border-radius: 20px; padding: 16px 26px; }
  .pip .plab .l1 { font-family: "MontserratX"; font-weight: 800; color: #fff; line-height: 1.05; white-space: nowrap; }
  .pip .plab .l2 { font-family: "MontserratX"; font-weight: 600; color: rgba(255,255,255,.72); line-height: 1.15; white-space: nowrap; }
  .tagill { position: absolute; top: -20px; right: 28px; z-index: 3; font-family: "MontserratX"; font-weight: 800;
            letter-spacing: .14em; padding: 10px 20px; border-radius: 999px; box-shadow: 0 10px 26px rgba(0,0,0,.35); }

  /* ---- B-roll window ---- */
  .broll .win { position: absolute; overflow: hidden; border-radius: 40px;
                box-shadow: 0 30px 80px rgba(0,0,0,.55); will-change: clip-path, filter, opacity; }
  .broll .win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .broll .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
                  background: linear-gradient(180deg, transparent, rgba(0,0,0,.66)); }
  .broll .blab { position: absolute; left: 42px; bottom: 36px; display: flex; flex-direction: column; }
  .broll .blab .l1 { font-family: "MontserratX"; font-weight: 800; color: #fff; line-height: 1.04;
                     text-shadow: 0 4px 18px rgba(0,0,0,.5); white-space: nowrap; }
  .broll .blab .l2 { font-family: "MontserratX"; font-weight: 600; color: rgba(255,255,255,.8);
                     line-height: 1.15; white-space: nowrap; }
  .broll .tagill { top: 24px; right: 24px; }

  /* ---- number counter ---- */
  .counter { position: absolute; inset: 0; }
  .counter .cwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .counter .num { font-family: "MontserratX"; font-weight: 800; letter-spacing: .005em;
                  text-shadow: 0 10px 34px rgba(0,0,0,.45); will-change: transform, opacity, filter; white-space: nowrap; }
  .counter .num .affix { font-size: .44em; }
  .counter .clab { font-family: "MontserratX"; font-weight: 600; color: #fff; letter-spacing: .16em;
                   text-shadow: 0 4px 16px rgba(0,0,0,.55); margin-top: 10px; white-space: nowrap; }

  /* ---- list plates ---- */
  .listp { position: absolute; inset: 0; }
  .listp .lwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .listp .lhead { font-family: "MontserratX"; font-weight: 800; letter-spacing: .08em; color: #0d0f12;
                  padding: 18px 38px; border-radius: 999px; box-shadow: 0 14px 36px rgba(0,0,0,.4); white-space: nowrap; }
  .listp .plate { display: flex; align-items: center; gap: 26px; background: rgba(9,11,15,.88); border-radius: 26px;
                  padding: 26px 38px 26px 28px; box-shadow: 0 16px 44px rgba(0,0,0,.42); will-change: transform, opacity, filter; }
  .listp .badge { flex: 0 0 auto; width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center;
                  justify-content: center; font-family: "MontserratX"; font-weight: 800; }
  .listp .ptx { display: flex; flex-direction: column; }
  .listp .pt1 { color: #fff; font-family: "MontserratX"; font-weight: 800; line-height: 1.05; white-space: nowrap; }
  .listp .pt2 { color: rgba(255,255,255,.66); font-family: "MontserratX"; font-weight: 600; line-height: 1.15; white-space: nowrap; }

  /* ---- process / step stack ---- */
  .proc { position: absolute; inset: 0; }
  .proc .pwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .proc .ptitle { font-family: "MontserratX"; font-weight: 800; letter-spacing: .08em; color: #0d0f12;
                  padding: 18px 38px; border-radius: 999px; box-shadow: 0 14px 36px rgba(0,0,0,.4);
                  margin-bottom: 34px; white-space: nowrap; }
  .proc .srow { display: flex; align-items: flex-start; gap: 28px; will-change: transform, opacity, filter; }
  .proc .scol { display: flex; flex-direction: column; align-items: center; }
  .proc .scirc { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                 font-family: "MontserratX"; font-weight: 800; flex: 0 0 auto; }
  .proc .sline { width: 6px; height: 40px; border-radius: 3px; margin: 8px 0; }
  .proc .stx { display: flex; flex-direction: column; padding-top: 6px; min-width: 430px; }
  .proc .st1 { color: #fff; font-family: "MontserratX"; font-weight: 800; line-height: 1.05; white-space: nowrap;
               text-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .proc .st2 { color: rgba(255,255,255,.7); font-family: "MontserratX"; font-weight: 600; line-height: 1.2; white-space: nowrap; }

  /* ---- light fx ---- */
  .fxlayer { position: absolute; inset: 0; overflow: hidden; }
  .fx-flash { position: absolute; inset: 0; }
  .fx-flare { position: absolute; width: 560px; height: 560px; margin: -280px 0 0 -280px; }
  .fx-leak { position: absolute; top: -30%; bottom: -30%; width: 46%; transform: rotate(16deg); filter: blur(30px); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const FPS = 30, W = 1080, H = 1920;
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeIn = t => t * t;
const F = s => Math.round(s * FPS); // seconds -> frames

let TL = null, builtItems = [], ACCENT = "#FFC531", stats = null;

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------------- item builders (DOM exists for the whole timeline) ------- */
function el(cls, parent) { const d = document.createElement("div"); d.className = cls; parent.appendChild(d); return d; }

const layoutJobs = [];
function buildPoster(item) {
  const root = el("item poster", stage);
  const zone = item.zone || [0.615, 0.845];
  const wrap = el("stackwrap", root);
  wrap.style.cssText = `position:absolute;left:0;right:0;top:${(((zone[0] + zone[1]) / 2) * H).toFixed(0)}px;transform:translateY(-50%);display:flex;justify-content:center;`;
  const stack = el("stack", wrap);
  const words = [];
  (item.rows || []).forEach(row => {
    const r = el("row", stack);
    row.forEach(wd => {
      const s = document.createElement("span");
      const kind = wd.kind || "conn";
      s.className = "w " + (kind === "key" ? "key" : kind === "serif" ? "serif" : kind === "neon" ? "neon" : "conn");
      s.textContent = wd.w;
      s.style.fontSize = (kind === "key" || kind === "neon" ? (item.keySize || 118) : (item.connSize || 54)) + "px";
      if (kind === "key") s.style.color = item.accent || ACCENT;
      if (kind === "neon") s.style.color = wd.color || "#FF3355";
      if (wd.glow) s.dataset.glow = "1";
      r.appendChild(s);
      const sp = document.createElement("span");
      sp.style.display = "inline-block"; sp.style.width = (kind === "key" ? 26 : 16) + "px";
      r.appendChild(sp);
      words.push({ el: s, at: wd.at, kind });
    });
  });
  layoutJobs.push(() => autofit(stack, 0.88));
  return { item, root, words };
}

function buildChip(item) {
  const root = el("item chip", stage);
  const zone = item.zone || [0.615, 0.845];
  root.style.justifyContent = "flex-start";
  root.style.flexDirection = "column";
  root.style.alignItems = "center";
  root.style.paddingTop = (((zone[0] + zone[1]) / 2) * H - 60) + "px";
  const bar = el("bar", root);
  bar.style.background = item.accent || ACCENT;
  const ic = el("ic", bar);
  ic.innerHTML = item.iconSvg || "";
  const tx = el("tx", bar);
  const t1 = el("t1", tx); t1.textContent = item.title || "";
  t1.style.fontSize = (item.titleSize || 52) + "px";
  if (item.sub) { const t2 = el("t2", tx); t2.textContent = item.sub; t2.style.fontSize = (item.subSize || 38) + "px"; }
  const streak = el("streak", bar);
  layoutJobs.push(() => autofit(bar, 0.70, true));
  return { item, root, bar, streak };
}

function buildCard(item) {
  const root = el("item card", stage);
  root.style.background = item.bg === "accent" ? (item.accent || ACCENT)
    : item.bg === "white" ? "#ffffff" : (item.bgColor || "#0c1015");
  const words = [];
  (item.lines || []).forEach(line => {
    const ln = el("cline", root);
    line.forEach(wd => {
      const s = document.createElement("span");
      s.className = "cw" + (wd.kind === "serif" ? " serif" : "") + (wd.kind === "neon" ? " neon" : "");
      s.textContent = wd.w;
      s.style.fontSize = (wd.size || item.wordSize || 120) + "px";
      if (wd.kind === "key") s.style.color = item.accent || ACCENT;
      if (wd.kind === "neon") s.style.color = wd.color || "#FF3355";
      if (item.bg === "accent" && wd.kind === "key") s.style.color = "#ffffff";
      ln.appendChild(s);
      const sp = document.createElement("span");
      sp.style.display = "inline-block"; sp.style.width = "30px";
      ln.appendChild(sp);
      words.push({ el: s, at: wd.at, kind: wd.kind || "word" });
    });
  });
  return { item, root, words };
}

function buildFx(item) {
  const root = el("item fxlayer", stage);
  let node = null;
  if (item.kind === "flash") {
    node = el("fx-flash", root);
    const c = item.color || item.accent || ACCENT;
    node.style.background = `radial-gradient(ellipse at 50% 42%, ${hexA(c, .85)} 0%, ${hexA(c, .25)} 45%, transparent 72%)`;
  } else if (item.kind === "flare") {
    node = el("fx-flare", root);
    const c = item.color || item.accent || ACCENT;
    node.style.left = ((item.x || 0.78) * W) + "px";
    node.style.top = ((item.y || 0.16) * H) + "px";
    node.style.background = `radial-gradient(circle, ${hexA("#ffffff", .95)} 0%, ${hexA(c, .55)} 26%, transparent 68%)`;
    node.style.borderRadius = "50%";
  } else if (item.kind === "leak") {
    node = el("fx-leak", root);
    const c = item.color || item.accent || ACCENT;
    node.style.background = `linear-gradient(90deg, transparent, ${hexA(c, .5)}, transparent)`;
  }
  return { item, root, node };
}

function zoneCentre(item, def) {
  const zone = item.zone || def || [0.615, 0.845];
  return { zone, cy: ((zone[0] + zone[1]) / 2) * H };
}

function mediaSrc(item) {
  return item.src && item.src.startsWith("/") ? "file://" + item.src : item.src;
}

function illTag(parent, item, size) {
  if (!item.illustrative) return null;
  const tag = el("tagill", parent);
  tag.textContent = "ILLUSTRATIVE";
  tag.style.background = item.accent || ACCENT;
  tag.style.color = "#0d0f12";
  tag.style.fontSize = (size || 26) + "px";
  return tag;
}

function buildPip(item) {
  const root = el("item pip", stage);
  const { cy } = zoneCentre(item);
  const cardW = Math.round((item.w || 0.58) * W);
  const imgH = Math.round(cardW * 0.66);
  root.style.paddingTop = Math.max(0, Math.round(cy - (imgH + 28) / 2)) + "px";
  const card = el("pcard", root);
  card.style.width = cardW + "px";
  const pimg = el("pimg", card);
  pimg.style.height = imgH + "px";
  const img = document.createElement("img");
  img.src = mediaSrc(item);
  pimg.appendChild(img);
  illTag(card, item);
  if (item.label) {
    const lab = el("plab", pimg);
    const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "44px";
    if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "34px"; }
  }
  return { item, root, pipCard: card, pipImg: img };
}

function buildBroll(item) {
  const root = el("item broll", stage);
  const zone = item.zone || [0.30, 0.80];
  const winW = Math.round(0.92 * W), winH = Math.round((zone[1] - zone[0]) * H);
  const win = el("win", root);
  win.style.left = ((W - winW) / 2) + "px";
  win.style.top = (zone[0] * H) + "px";
  win.style.width = winW + "px";
  win.style.height = winH + "px";
  win.style.border = `4px solid ${item.accent || ACCENT}`;
  const img = document.createElement("img");
  img.src = mediaSrc(item);
  win.appendChild(img);
  el("scrim", win);
  if (item.label) {
    const lab = el("blab", win);
    const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
    if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "40px"; }
  }
  illTag(win, item);
  return { item, root, win, bimg: img };
}

function buildCounter(item) {
  const root = el("item counter", stage);
  const { cy } = zoneCentre(item);
  const wrap = el("cwrap", root);
  wrap.style.top = Math.round(cy - 135) + "px";
  const num = el("num", wrap);
  num.style.color = item.accent || ACCENT;
  num.style.fontSize = "200px";
  if (item.prefix) { const s = document.createElement("span"); s.className = "affix"; s.textContent = item.prefix; num.appendChild(s); }
  const val = document.createElement("span");
  val.textContent = "0";
  num.appendChild(val);
  if (item.suffix) { const s = document.createElement("span"); s.className = "affix"; s.textContent = item.suffix; num.appendChild(s); }
  if (item.label) { const lab = el("clab", wrap); lab.textContent = item.label; }
  layoutJobs.push(() => {
    let fs = 200;
    while (num.scrollWidth > 950 && fs > 90) { fs -= 10; num.style.fontSize = fs + "px"; }
  });
  return { item, root, num, numVal: val };
}

function buildList(item) {
  const root = el("item listp", stage);
  const zone = item.zone || [0.50, 0.95];
  const wrap = el("lwrap", root);
  wrap.style.top = (zone[0] * H) + "px";
  let head = null;
  if (item.title) {
    head = el("lhead", wrap);
    head.textContent = item.title;
    head.style.background = item.accent || ACCENT;
    head.style.fontSize = "42px";
  }
  const plates = (item.items || []).map((pl, i) => {
    const pel = el("plate", wrap);
    const badge = el("badge", pel);
    badge.textContent = String(i + 1);
    badge.style.fontSize = "36px";
    const tx = el("ptx", pel);
    const t1 = el("pt1", tx); t1.textContent = pl.text; t1.style.fontSize = "54px";
    let t2 = null;
    if (pl.sub) { t2 = el("pt2", tx); t2.textContent = pl.sub; t2.style.fontSize = "36px"; }
    layoutJobs.push(() => {
      let fs = 54;
      while (t1.scrollWidth > 540 && fs > 30) { fs -= 4; t1.style.fontSize = fs + "px"; if (t2) t2.style.fontSize = Math.round(fs * 0.66) + "px"; }
    });
    return { el: pel, badge, at: pl.at };
  });
  return { item, root, plates, lhead: head };
}

function buildProcess(item) {
  const root = el("item proc", stage);
  const { cy } = zoneCentre(item, [0.52, 0.92]);
  const wrap = el("pwrap", root);
  wrap.style.top = Math.round(cy) + "px";
  wrap.style.transform = "translateY(-50%)";
  if (item.title) {
    const t = el("ptitle", wrap);
    t.textContent = item.title;
    t.style.background = item.accent || ACCENT;
    t.style.fontSize = "42px";
  }
  const steps = (item.steps || []).map((st, i, arr) => {
    const row = el("srow", wrap);
    const col = el("scol", row);
    const circ = el("scirc", col);
    circ.textContent = String(i + 1);
    circ.style.fontSize = "36px";
    let line = null;
    if (i < arr.length - 1) line = el("sline", col);
    const tx = el("stx", row);
    const t1 = el("st1", tx); t1.textContent = st.text; t1.style.fontSize = "56px";
    if (st.sub) { const t2 = el("st2", tx); t2.textContent = st.sub; t2.style.fontSize = "38px"; }
    layoutJobs.push(() => {
      let fs = 56;
      while (t1.scrollWidth > 560 && fs > 32) { fs -= 4; t1.style.fontSize = fs + "px"; }
    });
    return { row, circ, line, at: st.at };
  });
  return { item, root, steps };
}

function lifeFx(t, at, until, enterFrames) {
  // opacity resolves within 2 frames either side (semi-transparent QC);
  // the exit is a blur-out whose opacity only drops in the last 2 frames
  const opIn = clamp01((t - at) / (2 / FPS));
  const x = exitFade(until + 5 / FPS, t);
  return { op: Math.min(opIn, x.op), blur: x.blur, pIn: clamp01((t - at) / ((enterFrames || 10) / FPS)) };
}

function fmtVal(v, dec) {
  const parts = v.toFixed(dec).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.join(".");
}

function autofit(node, maxFrac, singleLine) {
  // shrink until the content fits the frame width (never touch the edges)
  const maxW = maxFrac * W;
  let scale = 1;
  for (let i = 0; i < 24; i++) {
    const w = node.scrollWidth;
    if (w <= maxW || scale <= 0.4) break;
    scale *= 0.94;
    node.style.transform = `scale(${scale})`;
    node.style.transformOrigin = "50% 0";
    if (singleLine) node.style.transformOrigin = "50% 50%";
  }
}

/* ---------------- per-frame application --------------------------------- */
function wordEnter(wd, t) {
  // returns style for a word element at time t (seconds); enters over 7f
  const dt = t - wd.at;
  const enterF = 7 / FPS, p = clamp01(dt / enterF);
  const blur = 6 * (1 - easeOut(p));
  const y = 34 * (1 - easeOut(p));
  const rot = 1.6 * (1 - easeOut(p));
  const op = clamp01(dt / (2 / FPS));
  let scale = 1;
  if (wd.kind === "key" || wd.kind === "neon") {
    const pk = clamp01(dt / (10 / FPS));
    scale = pk < 0.62 ? 0.85 + (1.08 - 0.85) * easeOut(pk / 0.62)
                     : 1.08 - 0.08 * easeOut((pk - 0.62) / 0.38);
  }
  return { blur, y, rot, op, scale };
}

function exitFade(endT, t) {
  // blur-out over the 5 frames before endT, opacity only in the last 2
  const rem = endT - t;
  const p = clamp01(1 - rem / (5 / FPS));
  return { blur: 6 * easeIn(p), op: rem <= 2 / FPS ? clamp01(rem / (2 / FPS)) : 1 };
}

function applyWord(wd, t, until) {
  const e = wordEnter(wd, t);
  // a word always completes its entry first: its exit cannot start
  // until 9 frames after it appeared (blur cross-swap, never a squeeze)
  const endT = Math.max(until, wd.at + 9 / FPS) + 5 / FPS;
  const x = exitFade(endT, t);
  const elx = wd.el;
  const glow = wd.el.dataset.glow === "1" || wd.kind === "key";
  let shadow = "0 6px 22px rgba(0,0,0,.45)";
  if (wd.kind === "key") {
    const dt = t - wd.at;
    const pulse = dt < 12 / FPS ? (0.55 + 0.45 * Math.sin((dt / (12 / FPS)) * Math.PI)) : 0.5;
    const c = wd.el.style.color;
    shadow = `0 0 ${26 * pulse + 10}px ${c}, 0 6px 22px rgba(0,0,0,.4)`;
  }
  if (wd.kind === "neon") {
    // electric glow with a 4-frame flicker at entry (glow only - the
    // word's opacity curve stays clean for the semi-transparent QC)
    const f = Math.round((t - wd.at) * FPS);
    const flick = f >= 3 && f <= 6 ? [0.45, 1, 0.6, 1][f - 3] : 1;
    const c = wd.el.style.color;
    shadow = `0 0 ${Math.round(17 * flick)}px ${c}, 0 0 ${Math.round(46 * flick)}px ${c}, 0 6px 22px rgba(0,0,0,.45)`;
  }
  elx.style.opacity = Math.min(e.op, x.op).toFixed(3);
  elx.style.filter = `blur(${Math.max(e.blur, x.blur).toFixed(2)}px)`;
  elx.style.transform = `translateY(${e.y.toFixed(1)}px) rotate(${e.rot.toFixed(2)}deg) scale(${e.scale.toFixed(3)})`;
  elx.style.textShadow = shadow;
  trackSemi(elx, Math.min(e.op, x.op));
}

const stage = document.getElementById("stage");
function trackSemi(elx, op) {
  // per-element accounting: a single word may not linger semi-transparent
  // for more than 2 consecutive frames (spec QC); different words
  // crossfading through each other is the designed transition
  const semi = op > 0.04 && op < 0.96;
  elx._semiRun = semi ? (elx._semiRun || 0) + 1 : 0;
  elx._semiMax = Math.max(elx._semiMax || 0, elx._semiRun);
  if (stats && semi) stats.semiFrames++;
  if (stats) stats.semiMaxRun = Math.max(stats.semiMaxRun || 0, elx._semiMax);
}

function renderAt(tMs) {
  const t = tMs / 1000;
  stats = { semiFrames: 0, semiMaxRun: 0 };
  for (const b of builtItems) {
    const it = b.item;
    const active = t >= it.at - 0.001 && t < (it.until ?? it.at + 2) + 6 / FPS;
    b.root.style.display = active ? "" : "none";
    if (!active) continue;
    if (b.words) b.words.forEach(wd => applyWord(wd, t, it.until ?? it.at + 2));
    if (b.bar) {
      const dt = t - it.at, until = it.until ?? it.at + 2;
      const wipe = clamp01(dt / (8 / FPS));
      const out = clamp01(((until - t)) / (4 / FPS));
      const blurOut = 8 * (1 - out);
      b.bar.style.clipPath = `inset(-30% ${(1 - easeOut(wipe)) * 100}% -30% 0 round 999px)`;
      b.bar.style.filter = `blur(${blurOut.toFixed(2)}px)`;
      b.bar.style.opacity = clamp01(dt / (2 / FPS)).toFixed(3);
      b.streak.style.left = `${-30 + wipe * 150}%`;
      b.streak.style.opacity = wipe > 0 && wipe < 1 ? 0.9 : 0;
    }
    if (b.node) {
      const dt = t - it.at, dur = it.dur || 0.45;
      const p = clamp01(dt / dur);
      let op = 0, scale = 1;
      if (it.kind === "flash") op = p < 0.3 ? easeOut(p / 0.3) : 1 - easeIn((p - 0.3) / 0.7);
      else if (it.kind === "flare") { op = Math.sin(p * Math.PI); scale = 0.6 + 0.5 * easeOut(p); }
      else if (it.kind === "leak") { op = Math.sin(p * Math.PI) * 0.85; b.node.style.left = `${-20 + p * 120}%`; }
      b.node.style.opacity = (op * (it.strength || 1)).toFixed(3);
      if (it.kind === "flare") b.node.style.transform = `scale(${scale.toFixed(3)}) rotate(${(p * 40).toFixed(1)}deg)`;
    }
    if (b.item.type === "card") {
      const until = it.until ?? it.at + 2;
      const inP = clamp01((t - it.at) / (2 / FPS));   // bg snaps in 2f (no ghosting)
      const outP = clamp01((until - t) / (4 / FPS));
      b.root.style.opacity = Math.min(inP, outP).toFixed(3);
    }
    if (b.pipCard) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      b.pipCard.style.opacity = L.op.toFixed(3);
      b.pipCard.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      b.pipCard.style.transform = `translateY(${((1 - easeOut(L.pIn)) * 46).toFixed(1)}px) ` +
        `rotate(${(-1.4 * (1 - easeOut(L.pIn))).toFixed(2)}deg) scale(${(0.88 + 0.12 * easeOut(L.pIn)).toFixed(3)})`;
      const life = clamp01((t - it.at) / Math.max(0.001, until - it.at));
      b.pipImg.style.transform = `scale(${(1.05 + 0.08 * life).toFixed(3)})`;
      trackSemi(b.pipCard, L.op);
    }
    if (b.win) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 10);
      const p = easeOut(L.pIn);
      b.win.style.clipPath = `inset(${((1 - p) * 44).toFixed(2)}% ${((1 - p) * 10).toFixed(2)}% ` +
        `${((1 - p) * 44).toFixed(2)}% ${((1 - p) * 10).toFixed(2)}% round 40px)`;
      b.win.style.opacity = L.op.toFixed(3);
      b.win.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      const life = clamp01((t - it.at) / Math.max(0.001, until - it.at));
      b.bimg.style.transform = `scale(${(1.07 + 0.08 * life).toFixed(3)}) translateX(${(-1.6 + 3.2 * life).toFixed(2)}%)`;
      trackSemi(b.win, L.op);
    }
    if (b.num) {
      const until = it.until ?? it.at + 2;
      const L = lifeFx(t, it.at, until, 6);
      const cd = it.countDur || 0.9;
      const p = clamp01((t - it.at) / cd);
      b.numVal.textContent = fmtVal((it.value || 0) * easeOut(p), it.decimals || 0);
      let sc = 0.92 + 0.08 * easeOut(clamp01((t - it.at) / (6 / FPS)));
      if (p >= 1) {   // lock pop once the count lands
        const q = clamp01((t - it.at - cd) / (6 / FPS));
        sc *= 1 + 0.1 * Math.sin(q * Math.PI);
      }
      b.num.style.opacity = L.op.toFixed(3);
      b.num.style.filter = `blur(${(L.blur * 1.4).toFixed(2)}px)`;
      b.num.style.transform = `scale(${sc.toFixed(3)})`;
      trackSemi(b.num, L.op);
    }
    if (b.plates) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until + 5 / FPS, t);
      b.root.style.opacity = x.op.toFixed(3);
      b.root.style.filter = `blur(${(x.blur * 1.2).toFixed(2)}px)`;
      if (b.lhead) b.lhead.style.opacity = clamp01((t - it.at) / (2 / FPS)).toFixed(3);
      let lastStarted = -1;
      b.plates.forEach((pl, i) => { if (t >= pl.at) lastStarted = i; });
      b.plates.forEach((pl, i) => {
        const dt = t - pl.at;
        const p = easeOut(clamp01(dt / (7 / FPS)));
        const op = clamp01(dt / (2 / FPS));
        pl.el.style.opacity = op.toFixed(3);
        pl.el.style.transform = `translateX(${(-70 * (1 - p)).toFixed(1)}px)`;
        pl.el.style.filter = `blur(${(5 * (1 - p)).toFixed(2)}px)`;
        const active = i === lastStarted;
        pl.badge.style.background = active ? (it.accent || ACCENT) : "rgba(255,255,255,.16)";
        pl.badge.style.color = active ? "#0d0f12" : "#ffffff";
        trackSemi(pl.el, op);
      });
    }
    if (b.steps) {
      const until = it.until ?? it.at + 2;
      const x = exitFade(until + 5 / FPS, t);
      b.root.style.opacity = x.op.toFixed(3);
      b.root.style.filter = `blur(${(x.blur * 1.2).toFixed(2)}px)`;
      let lastStarted = -1;
      b.steps.forEach((s, i) => { if (t >= s.at) lastStarted = i; });
      b.steps.forEach((s, i) => {
        const dt = t - s.at;
        const p = easeOut(clamp01(dt / (7 / FPS)));
        const op = clamp01(dt / (2 / FPS));
        s.row.style.opacity = op.toFixed(3);
        s.row.style.transform = `translateY(${(26 * (1 - p)).toFixed(1)}px)`;
        if (i < lastStarted) {
          s.circ.textContent = "✓";
          s.circ.style.background = "rgba(255,255,255,.14)";
          s.circ.style.color = "#ffffff";
          s.circ.style.border = `3px solid ${hexA(it.accent || ACCENT, .85)}`;
          s.circ.style.boxShadow = "none";
        } else if (i === lastStarted) {
          s.circ.textContent = String(i + 1);
          s.circ.style.background = it.accent || ACCENT;
          s.circ.style.color = "#0d0f12";
          s.circ.style.border = "3px solid transparent";
          s.circ.style.boxShadow = `0 0 30px ${hexA(it.accent || ACCENT, .55)}`;
        } else {
          s.circ.textContent = String(i + 1);
          s.circ.style.background = "transparent";
          s.circ.style.color = "rgba(255,255,255,.55)";
          s.circ.style.border = "3px solid rgba(255,255,255,.3)";
          s.circ.style.boxShadow = "none";
        }
        if (s.line) s.line.style.background = i < lastStarted ? (it.accent || ACCENT) : "rgba(255,255,255,.18)";
        trackSemi(s.row, op);
      });
    }
  }
  return stats;
}

window.setTimeline = function (tl) {
  TL = tl;
  ACCENT = (tl.brand && tl.brand.accent) || ACCENT;
  stage.innerHTML = "";
  builtItems = [];
  layoutJobs.length = 0;
  const builders = { poster: buildPoster, chip: buildChip, card: buildCard, fx: buildFx,
                     pip: buildPip, broll: buildBroll, counter: buildCounter,
                     list: buildList, process: buildProcess };
  for (const item of tl.items || []) {
    if (item.type === "fx" && item.until == null) item.until = item.at + (item.dur || 0.45);
    const b = builders[item.type];
    if (b) builtItems.push(b(item));
  }
  return builtItems.length;
};
window.renderAt = renderAt;
window.layoutStage = function () {
  // run once fonts are in: autofit must measure with real metrics
  for (const job of layoutJobs) job();
  return layoutJobs.length;
};
</script>
</body>
</html>
