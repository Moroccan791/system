<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>

     default workhorse. */

  @font-face { font-family: "PackPoppins"; src: url("file:///home/user/system/assets/fonts/Poppins-ExtraBold.woff2"); font-weight: 800; }
  @font-face { font-family: "PackLuckiest"; src: url("file:///home/user/system/assets/fonts/LuckiestGuy.woff2"); font-weight: 400; }
  @font-face { font-family: "PackBebas"; src: url("file:///home/user/system/assets/fonts/BebasNeue.woff2"); font-weight: 400; }
  @font-face { font-family: "PackGrotesk"; src: url("file:///home/user/system/assets/fonts/SpaceGrotesk-Bold.woff2"); font-weight: 700; }
  @font-face { font-family: "PackSerif"; src: url("file:///home/user/system/assets/fonts/PlayfairDisplay-Bold.woff2"); font-weight: 700; }

  /* ---- editorial cuts added for the style card (OFL, fontsource) ----
     Six looks the user picked by name: medium oblique, bold italic,
     sans italic, regular, display book italic, grande semibold. */
  @font-face { font-family: "PackOblique"; src: url("file:///home/user/system/assets/fonts/Archivo-MediumItalic.woff2"); font-weight: 500; font-style: italic; }
  @font-face { font-family: "PackSerifBoldItalic"; src: url("file:///home/user/system/assets/fonts/PlayfairDisplay-BoldItalic.woff2"); font-weight: 700; font-style: italic; }
  @font-face { font-family: "PackSansItalic"; src: url("file:///home/user/system/assets/fonts/Montserrat-Italic.woff2"); font-weight: 400; font-style: italic; }

  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #stage { position: absolute; inset: 0; }
  .item { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

  /* ---- poster captions ---- */
  .poster { display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            z-index: 2; }

  .endcard { z-index: 4; }
  .poster .stack { display: flex; flex-direction: column; align-items: center; position: relative; }
  /* soft dark plate under the stack (spec 1.6): an invisible-feeling
     radial falloff that guarantees the 4.5:1 ground on bright footage */
  .poster .stack::before { content: ""; position: absolute; inset: -30px -56px; z-index: -1;

  .poster .row { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; }

  .poster .w.conn { font-weight: 800; letter-spacing: .02em; }

  /* ---- B-roll window ---- */
  .broll .win { position: absolute; overflow: hidden; border-radius: 40px;
                box-shadow: 0 30px 80px rgba(0,0,0,.55); will-change: clip-path, filter, opacity; }
  .broll .win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }

  /* ---- marker captions (captionStyle "marker"): clean rounded ink,
     a marker bar wiping behind the key word's lower half, a semantic
     second accent, gradient heroes, sticker glued to a word ---- */
  .poster .w.mark, .poster .w.pay, .poster .w.grad { position: relative; z-index: 0;
    -webkit-text-stroke: 2px rgba(0,0,0,.45); }
  .poster .w .mkbar { position: absolute; left: -8px; right: -8px; bottom: 4%; height: 46%;
    z-index: -1; border-radius: 6px; transform-origin: 0 50%; will-change: transform, opacity; }
  .poster .w .sticker { position: absolute; top: -0.62em; right: -0.85em; width: 0.95em; height: 0.95em;
    z-index: 2; will-change: transform, opacity; pointer-events: none; }
  .poster .w .sticker img { width: 100%; height: 100%; display: block; }

  /* ---- impact captions (captionStyle "impact"): the reference-edit
     system (recipes/editing_brain.md) - centred condensed caps, hard

     NO soft radial plate: the type sits on the picture like print. */
  .poster .stack.impact::before { display: none; }
  .poster .stack.impact .w { text-transform: uppercase; letter-spacing: .02em;
    -webkit-text-stroke: 4px rgba(0,0,0,.85); }

  /* ---- editorial captions (captionStyle "editorial") -----------------
     Print type on picture: caps, tight tracking, a THIN hard outline
     for legibility, no drop shadow, no soft plate, no glow. The
     keyword swaps to the accent colour - it does not get a plate and
     it never wipes in. */
  .poster .stack.editorial::before { display: none; }
  .poster .stack.editorial .w { text-transform: uppercase; letter-spacing: -.005em;
    -webkit-text-stroke: 2px rgba(0,0,0,.92); paint-order: stroke fill;
    text-shadow: none; font-weight: 800; }
  .poster .stack.editorial .w.conn { font-weight: 600; }
  .poster .stack.editorial .w.key, .poster .stack.editorial .w.hero {
    /* Match a Book Italic specimen rather than synthesising bold. */
    font-weight: 400; letter-spacing: -.025em;
  }
  .poster .stack.editorial .w.serif { text-transform: none; letter-spacing: -.01em; }

  /* ---- proof card: the receipt (testimonial / screenshot / number) ---- */
  .proof { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; }
  .proof .pfcard { background: #FDFEFE; border-radius: 36px; padding: 34px 40px 38px; width: 84%;

  .proof .pfhead { display: flex; align-items: center; gap: 24px; margin-bottom: 22px; }
  .proof .pfav { flex: 0 0 auto; width: 88px; height: 88px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-family: "MontserratX"; font-weight: 800;
    font-size: 40px; color: #0D0F12; }
  .proof .pfname { font-family: "MontserratX"; font-weight: 800; color: #10151D; font-size: 56px; line-height: 1.05; }
  .proof .pfrole { font-family: "MontserratX"; font-weight: 700; font-size: 36px; letter-spacing: .08em; margin-top: 4px; }
  .proof .pfimg { position: relative; border-radius: 22px; overflow: hidden; margin-bottom: 24px; }
  .proof .pfimg img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .proof .pfhotbox { position: absolute; border: 5px solid; border-radius: 12px; will-change: opacity, transform; }
  .proof .pfline { font-family: "MontserratX"; font-weight: 700; color: #1B2534; font-size: 50px;
    line-height: 1.22; margin-top: 6px; will-change: transform, opacity; }
  .proof .pfline .hotwrap { position: relative; z-index: 0; white-space: nowrap; }
  .proof .pfline .hotbar { position: absolute; left: -5px; right: -5px; bottom: 2%; height: 52%;
    z-index: -1; border-radius: 5px; transform-origin: 0 50%; will-change: transform; }
  .proof .pfval { display: flex; align-items: baseline; gap: 20px; margin-top: 24px; }
  .proof .pfnum { font-family: "MontserratX"; font-weight: 800; font-size: 108px; line-height: 1; }
  .proof .pflab { font-family: "MontserratX"; font-weight: 700; color: #5A6B84; font-size: 38px;
    letter-spacing: .06em; text-transform: uppercase; }

  /* ---- phone frame: a screen recording / profile, scrolled ---- */
  .phone { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; }
  .phone .phframe { background: #05070A; border-radius: 56px; padding: 18px;
    box-shadow: 0 34px 90px rgba(0,0,0,.6), inset 0 0 0 4px #232A35; will-change: transform, opacity, filter; }
  .phone .phscreen { position: relative; overflow: hidden; border-radius: 40px; background: #0B0E13; }
  .phone .phscreen img { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .phone .phnotch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 34%; height: 30px; border-radius: 99px; background: #05070A; z-index: 3; }
  .phone .phhandle { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 44px 30px 20px;
    background: linear-gradient(180deg, transparent, rgba(3,5,8,.82)); color: #fff;
    font-family: "MontserratX"; font-weight: 800; font-size: 42px; }

  /* ---- hand-drawn doodle arrow ---- */
  .doodle { position: absolute; inset: 0; }
  .doodle svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .doodle .ddlab { position: absolute; font-family: "MontserratX"; font-weight: 800; color: #fff;
    -webkit-text-stroke: 2px rgba(0,0,0,.5); paint-order: stroke fill;
    text-shadow: 0 4px 16px rgba(0,0,0,.5); will-change: opacity, transform; }

  /* ---- number counter ---- */
  .counter { position: absolute; inset: 0; }
  .counter .cwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .counter .cwrap::before { content: ""; position: absolute; inset: -34px 90px; z-index: -1;
    border-radius: 999px;
    background: radial-gradient(ellipse at center, rgba(4,7,10,.52) 55%, rgba(4,7,10,0) 88%); }
  .counter .num { font-family: "MontserratX"; font-weight: 800; letter-spacing: .005em;
                  text-shadow: 0 10px 34px rgba(0,0,0,.45); will-change: transform, opacity, filter; white-space: nowrap; }
  .counter .num .affix { font-size: .44em; }
  .counter .clab { font-family: "MontserratX"; font-weight: 800; color: #fff; letter-spacing: .14em;
                   font-size: 58px; -webkit-text-stroke: 2px rgba(0,0,0,.5); paint-order: stroke fill;
                   text-shadow: 0 4px 16px rgba(0,0,0,.55); margin-top: 14px; white-space: nowrap; }

  /* ---- list plates ---- */
  .listp { position: absolute; inset: 0; }
  .listp .lwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .listp .lhead { font-family: "MontserratX"; font-weight: 800; letter-spacing: .08em; color: #0d0f12;
                  padding: 18px 38px; border-radius: 999px; box-shadow: 0 14px 36px rgba(0,0,0,.4); white-space: nowrap; }
  .listp .plate { display: flex; align-items: center; gap: 26px; background: rgba(9,11,15,.88); border-radius: 26px;
                  padding: 26px 38px 26px 28px; box-shadow: 0 16px 44px rgba(0,0,0,.42); will-change: transform, opacity, filter; }
  .listp .badge { flex: 0 0 auto; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center;
                  justify-content: center; font-family: "MontserratX"; font-weight: 800; }
  .listp .ptx { display: flex; flex-direction: column; }
  .listp .pt1 { color: #fff; font-family: "MontserratX"; font-weight: 800; line-height: 1.05; white-space: nowrap; }
  .listp .pt2 { color: rgba(255,255,255,.66); font-family: "MontserratX"; font-weight: 600; line-height: 1.15; white-space: nowrap; }

  /* ---- process / step stack ---- */
  .proc { position: absolute; inset: 0; }
  .proc .pwrap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .proc .ptitle { font-family: "MontserratX"; font-weight: 800; letter-spacing: .08em; color: #0d0f12;
                  padding: 18px 38px; border-radius: 999px; box-shadow: 0 14px 36px rgba(0,0,0,.4);
                  margin-bottom: 34px; white-space: nowrap; }
  .proc .srow { display: flex; align-items: flex-start; gap: 28px; will-change: transform, opacity, filter;

  .proc .scol { display: flex; flex-direction: column; align-items: center; }
  .proc .scirc { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center;

  .proc .sline { width: 6px; height: 40px; border-radius: 3px; margin: 8px 0; }
  .proc .stx { display: flex; flex-direction: column; padding-top: 6px; min-width: 430px; }
  .proc .st1 { color: #fff; font-family: "MontserratX"; font-weight: 800; line-height: 1.05; white-space: nowrap;

  .proc .st2 { color: rgba(255,255,255,.7); font-family: "MontserratX"; font-weight: 600; line-height: 1.2; white-space: nowrap; }

  /* ---- light fx ---- */
  .fxlayer { position: absolute; inset: 0; overflow: hidden; }
  .fx-flash { position: absolute; inset: 0; }
  /* full-frame diagonal light leak (screen-style wash), never a blob */
  .fx-flare { position: absolute; inset: -12%; will-change: opacity, transform; }
  .fx-leak { position: absolute; top: -30%; bottom: -30%; width: 46%; transform: rotate(16deg); filter: blur(30px); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const FPS = 30, W = 1080, H = 1920;
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeIn = t => t * t;
const easeInOut = t => t * t * (3 - 2 * t);
const fmt = v => fmtVal(v, 0);
const F = s => Math.round(s * FPS); // seconds -> frames

let TL = null, builtItems = [], ACCENT = "#FFC531", stats = null;
let THEME = { radius: "round", glow: 1, speed: 1, easing: "pop", fontMode: "sans" };
// font pack registry: name -> CSS family. A pack is a whole-video
// voice; the style card can also assign a pack PER ROLE.
const PACKS = {
  montserrat: "MontserratX", anton: "PackAnton", bebas: "PackBebas",
  grotesk: "PackGrotesk", serif: "PackSerif", archivo: "PackArchivo",
  poppins: "PackPoppins", luckiest: "PackLuckiest",
  // the six editorial cuts from the style card
  oblique: "PackOblique",            // medium oblique (slanted grotesk)
  serifbi: "PackSerifBoldItalic",    // bold italic (display serif)
  sansitalic: "PackSansItalic",      // sans italic
  regular: "PackRegular",            // regular (neutral grotesk)
  displaybook: "PackDisplayBook",    // display book italic
  grande: "PackGrande"               // grande semibold
};
const ROLE_SEL = {
  caption: ".poster .w.conn, .card .cw, .chip .t1",
  keyword: ".poster .w.key, .poster .w.hero, .poster .w.pay, .poster .w.grad, .poster .w.neon",

/* ---------------- item builders (DOM exists for the whole timeline) ------- */
function el(cls, parent) { const d = document.createElement("div"); d.className = cls; parent.appendChild(d); return d; }

const layoutJobs = [];
function buildPoster(item) {
  const root = el("item poster", stage);
  const zone = item.zone || [0.615, 0.845];
  const wrap = el("stackwrap", root);
  const topFrac = (item.place3d && item.place3d.y) || ((zone[0] + zone[1]) / 2);
  wrap.style.cssText = `position:absolute;left:0;right:0;top:${(topFrac * H).toFixed(0)}px;transform:translateY(-50%);display:flex;justify-content:center;`;
  const stack = el("stack", wrap);
  const words = [];
  const style = item.captionStyle || THEME.captionStyle || "pop";
  if (style === "impact") stack.classList.add("impact");
  if (style === "editorial") stack.classList.add("editorial");
  const kara = style === "karaoke";
  const markerStyle = style === "marker";
  (item.rows || []).forEach(row => {
    const r = el("row", stack);
    row.forEach(wd => {
      const s = document.createElement("span");
      const kind = wd.kind || "conn";
      s.className = "w " + (kind === "key" ? "key" : kind === "hero" ? "hero"
        : kind === "serif" ? "serif" : kind === "neon" ? "neon"
        : kind === "mark" ? "mark" : kind === "pay" ? "pay"
        : kind === "grad" ? "grad" : "conn");
      s.textContent = wd.w;
      // an explicit per-word size always wins (a serif hero has to be
      // able to scale to display size); otherwise the kind decides.
      s.style.fontSize = (wd.size
        ? wd.size
        : kind === "hero" ? (item.heroSize || 250)
        : ["key", "neon", "mark", "pay", "grad"].includes(kind) ? (item.keySize || 118)
        : markerStyle ? (item.wordSize || 96)
        : (item.connSize || 58)) + "px";
      if (markerStyle && !THEME.fontPack) s.style.fontFamily = "\"PackPoppins\"";
      let mkbar = null, sticker = null;
      if (kind === "mark") {
        // marker bar: wipes in behind the word's lower half as the
        // word lands (the R4 "3 Questions" swipe); white ink on top
        mkbar = document.createElement("span");
        mkbar.className = "mkbar";
        mkbar.style.background = wd.color || item.accent || ACCENT;
        s.appendChild(mkbar);
        s.dataset.glowc = wd.color || item.accent || ACCENT;
      }
      if (kind === "pay") {
        // semantic second accent: the payoff voice of the line
        const c2 = wd.color || item.accent2 || "#2FD574";
        s.style.color = c2;
        s.dataset.glowc = c2;
      }
      if (kind === "grad") {
        // gradient hero ink (R2's cyan->pink BECOME)
        const g = item.gradient || [item.accent || ACCENT, item.accent2 || "#F472B6"];
        s.style.background = `linear-gradient(92deg, ${g[0]}, ${g[1]})`;
        s.style.webkitBackgroundClip = "text";
        s.style.backgroundClip = "text";
        s.style.color = "transparent";
        s.style.webkitTextStroke = "2px rgba(0,0,0,.35)";
        s.dataset.glowc = g[0];
      }
      if (wd.emoji) {
        // sticker glued to the word (the 💡 on "ideas."): a Twemoji
        // PNG from assets/icons, popped in as the word lands
        sticker = document.createElement("span");
        sticker.className = "sticker";
        const im = document.createElement("img");
        im.src = "file:///home/user/system/assets/icons/" + wd.emoji + ".png";
        im.alt = "";
        sticker.appendChild(im);
        s.appendChild(sticker);
      }
      if (kind === "key") {
        // keyword = ink on an accent PLATE (the format's highlight
        // word): the pair is 4.5:1+ by construction on any footage,
        // where accent-coloured glyphs on a bright wall cannot be
        const ac = item.accent || ACCENT;
        if (style === "editorial") {
          // editorial: a flat COLOUR SWAP instead of a plate - the
          // word stays type, it just changes ink. No box, no bar.
          s.style.background = "none";
          s.style.color = wd.color || ac;

      if (style === "neon" && kind !== "key" && kind !== "hero" && kind !== "neon")

    for (const wd of words) {

    // silhouette, so they are allowed 94% of the frame

function buildChip(item) {
  const root = el("item chip", stage);
  const zone = item.zone || [0.615, 0.845];
  root.style.justifyContent = "flex-start";
  root.style.flexDirection = "column";
  root.style.alignItems = "center";
  const bar = el("bar", root);
  bar.style.background = item.accent || ACCENT;
  // fixed 67%-of-frame bar (spec 65-70% wide, 6-7% high), icon left,
  // single text line: a second line would push the bar past 7% high
  // OR the text under the 3% floor - the schema rejects `sub` on chips
  bar.style.width = Math.round(0.67 * W) + "px";
  const ic = el("ic", bar);
  ic.innerHTML = item.iconSvg || "";
  const tx = el("tx", bar);
  const t1 = el("t1", tx); t1.textContent = item.title || "";
  t1.style.fontSize = (item.titleSize || 64) + "px";
  const streak = el("streak", bar);
  root.style.paddingTop = Math.round(((zone[0] + zone[1]) / 2) * H - 62) + "px";
  layoutJobs.push(() => {
    let fs = item.titleSize || 64;
    while (t1.scrollWidth > 560 && fs > 58) { fs -= 2; t1.style.fontSize = fs + "px"; }
  });
  return { item, root, bar, streak };
}

function buildCard(item) {
  const root = el("item card", stage);
  root.style.background = item.bg === "accent" ? (item.accent || ACCENT)
    : item.bg === "white" ? "#ffffff" : (item.bgColor || "#0c1015");
  const words = [];
  const lineEls = [];
  (item.lines || []).forEach(line => {
    const ln = el("cline", root);
    lineEls.push(ln);
    line.forEach(wd => {
      const s = document.createElement("span");
      s.className = "cw" + (wd.kind === "serif" ? " serif" : "") + (wd.kind === "neon" ? " neon" : "");
      s.textContent = wd.w;
      s.style.fontSize = (wd.size || item.wordSize || 120) + "px";
      if (wd.kind === "key" && item.bg !== "accent") {
        const ac = item.accent || ACCENT;
        s.style.background = ac;
        s.style.color = "#0D0F12";
        s.style.webkitTextStroke = "0px";
        s.style.padding = "0px 20px";
        s.style.borderRadius = "16px";
        s.dataset.glowc = ac;
      }
      if (wd.kind === "neon") s.style.color = wd.color || "#FF3355";
      if (item.bg === "accent" && wd.kind === "key") s.style.color = "#ffffff";
      ln.appendChild(s);
      const sp = document.createElement("span");
      sp.style.display = "inline-block"; sp.style.width = "30px";
      ln.appendChild(sp);

    });

    // card lines must never bleed off the frame: one uniform scale
    // for all lines (type hierarchy survives), floored so the
    // smallest word stays readable; _fitScale is unused here (the
    // drift lives on the card root), the scale is baked per line
    let sc = 1;
    for (const ln of lineEls) sc = Math.min(sc, (0.88 * W) / Math.max(1, ln.scrollWidth));

    for (const ln of lineEls) {

      ln.style.transformOrigin = "50% 50%";
    }

}

function buildFx(item) {
  const root = el("item fxlayer", stage);
  let node = null;
  if (item.kind === "flash") {
    node = el("fx-flash", root);
    const c = item.color || item.accent || ACCENT;
    node.style.background = `radial-gradient(ellipse at 50% 42%, ${hexA(c, .85)} 0%, ${hexA(c, .25)} 45%, transparent 72%)`;
  } else if (item.kind === "flare") {
    node = el("fx-flare", root);
    const c = item.color || item.accent || ACCENT;

      `linear-gradient(115deg, transparent 30%, ${hexA("#ffffff", .75)} 46%, ` +
      `${hexA(c, .8)} 58%, transparent 78%)`;

function buildLower(item) {
  // speaker lower-third: name + role on a dark plate, bottom-LEFT
  // (captions own the centre; this owns the introduction moment)
  const root = el("item lowerthird", stage);
  const zone = item.zone || [0.80, 0.93];

function zoneCentre(item, def) {
  const zone = item.zone || def || [0.615, 0.845];
  return { zone, cy: ((zone[0] + zone[1]) / 2) * H };
}

function mediaSrc(item) {
  return item.src && item.src.startsWith("/") ? "file://" + item.src : item.src;
}

function illTag(parent, item, size) {
  if (!item.illustrative) return null;
  const tag = el("tagill", parent);
  tag.textContent = "ILLUSTRATIVE";
  tag.style.background = item.accent || ACCENT;
  tag.style.color = "#0d0f12";
  tag.style.fontSize = (size || 58) + "px";

function buildHook(item) {

  // cutaway, never text over the face). Lines stagger in fast,
  // the whole slate drifts 100->103% and dissolves AT until.
  const root = el("item hook", stage);
  const slate = el("slate", root);
  const kick = el("hk-kicker", slate);
  kick.textContent = (item.sub || "WATCH THIS").toUpperCase();
  const lines = [];
  (item.hookLines || []).forEach(txt => {
    const ln = el("hk-line", slate);
    ln.textContent = txt;
    ln.style.fontSize = (item.wordSize || 148) + "px";

  });
  const bar = el("hk-bar", slate);
  bar.style.background = item.accent || ACCENT;
  layoutJobs.push(() => {
    let fs = item.wordSize || 148;
    const widest = () => Math.max(1, ...lines.map(l => l.scrollWidth));
    while (widest() > 0.90 * W && fs > 62) {
      fs -= 4;
      lines.forEach(l => l.style.fontSize = fs + "px");

function buildEndcard(item) {
  // end card: 1s branded outro slate (name + handle + follow
  // kicker). Tail-anchored by the validator; dissolves at until.
  const root = el("item endcard", stage);
  const slate = el("slate", root);
  const kick = el("hk-kicker", slate);
  kick.textContent = "FOLLOW FOR MORE";

  nm.style.color = item.accent || ACCENT;

    hd.textContent = item.sub;
    lines.push(hd);
  }
  const bar = el("hk-bar", slate);
  bar.style.background = item.accent || ACCENT;
  layoutJobs.push(() => {
    let fs = item.wordSize || 120;
    while (nm.scrollWidth > 0.90 * W && fs > 58) {

function buildPip(item) {
  const root = el("item pip", stage);
  const { cy } = zoneCentre(item);
  const cardW = Math.round((item.w || 0.58) * W);
  const imgH = Math.round(cardW * 0.66);
  root.style.paddingTop = Math.max(0, Math.round(cy - (imgH + 28) / 2)) + "px";
  const card = el("pcard", root);
  card.style.width = cardW + "px";
  const pimg = el("pimg", card);
  pimg.style.height = imgH + "px";
  const img = document.createElement("img");
  img.src = mediaSrc(item);
  pimg.appendChild(img);
  illTag(card, item);
  if (item.label) {
    const lab = el("plab", pimg);
    const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
    if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "58px"; }
  }
  return { item, root, pipCard: card, pipImg: img };

function buildBroll(item) {
  const root = el("item broll", stage);
  const win = el("win", root);
  let full = false;
  if ((item.mode || "fullbleed") === "fullbleed") {
    // preferred form: replaces the speaker full-frame for 1.0-1.8 s,
    // the running caption stack stays over it (authored as a poster)
    full = true;
    win.style.left = "0px"; win.style.top = "0px";
    win.style.width = W + "px"; win.style.height = H + "px";
    win.style.borderRadius = "0px";
    win.style.boxShadow = "none";
  } else {
    // alternate card: 60-70% wide, centred (never a corner, never <55%)
    const winW = Math.round((item.w || 0.65) * W);
    const zone = item.zone || [0.30, 0.80];
    const winH = Math.round((zone[1] - zone[0]) * H);
    win.style.left = ((W - winW) / 2) + "px";
    win.style.top = (zone[0] * H) + "px";
    win.style.width = winW + "px";
    win.style.height = winH + "px";
    win.style.border = `4px solid ${hexA(item.accent || ACCENT, .9)}`;
    win.style.boxShadow = `0 30px 80px rgba(0,0,0,.55), 0 0 44px ${hexA(item.accent || ACCENT, .35)}`;
  }
  let img, vid = null;
  if (item.video) {
    // motion B-roll (stock / client clip): a real <video>, seeked
    // deterministically per frame by window.syncVideos (render.mjs)
    vid = document.createElement("video");
    vid.src = mediaSrc(item);
    vid.muted = true;
    vid.setAttribute("playsinline", "");
    vid.preload = "auto";
    win.appendChild(vid);
    img = vid;
  } else {
    img = document.createElement("img");
    img.src = mediaSrc(item);
    win.appendChild(img);
  }
  el("scrim", win);
  if (item.label) {
    const lab = el("blab", win);
    const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
    if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "58px"; }
  }
  illTag(win, item);
  let bubbles = null;
  if (item.messages && item.messages.length) {
    // recreated chat bubbles typing in over the B-roll (R1's desk
    // scene): the conversation is the caption for a silent insert
    const bw = el("bubbles", win);
    bubbles = item.messages.map((m, i) => {
      const b = el("bubble", bw);
      b.textContent = m.text;
      b.style.background = m.me ? "#2E7CF6" : "rgba(16,20,27,.88)";
      b.style.borderRadius = m.me ? "30px 30px 6px 30px" : "30px 30px 30px 6px";
      b.style.alignSelf = m.me ? "flex-end" : "flex-start";
      return { el: b, at: m.at != null ? m.at : item.at + 0.3 + i * 0.4 };
    });
  }
  return { item, root, win, bimg: img, bvid: vid, bubbles, bfull: full };
}

/* ---- animated vector scenes (Fiverr-style: drawn, not photographed).
   Deterministic SVG: every property derives from the frame clock. */
const VEC_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  const n = document.createElementNS(VEC_NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function buildVector(item) {
  const ac = item.accent || ACCENT;
  const full = (item.mode || "card") === "fullbleed";
  const V = { name: item.name || "burst", n: {} };
  let svg;
  if (full) {
    const root = el("item broll vecfull", stage);
    const win = el("win", root);
    win.style.left = "0px"; win.style.top = "0px";
    win.style.width = W + "px"; win.style.height = H + "px";
    win.style.borderRadius = "0px"; win.style.boxShadow = "none";
    win.style.background = "#101319";
    const wrap = el("pimg", win);
    wrap.style.cssText = "position:absolute;inset:0;";
    svg = svgEl("svg", { viewBox: "0 0 1080 1920", preserveAspectRatio: "xMidYMid slice" }, wrap);
    svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;";
    if (item.label) {
      const lab = el("blab", win);
      const l1 = el("l1", lab); l1.textContent = item.label; l1.style.fontSize = "58px";
      if (item.sub) { const l2 = el("l2", lab); l2.textContent = item.sub; l2.style.fontSize = "58px"; }
    }
    buildScene(svg, V, ac, item, 1080, 1920);
    // the scene ground is the svg's first rect: let the style card
    // repaint it (REF1 runs white full-screen scenes)
    const sceneGround = item.bgColor || (THEME.colors || {}).sceneBg;
    if (sceneGround) {
      const r0 = svg.querySelector("rect");
